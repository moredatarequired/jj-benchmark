name: tasks

# Two cheap gates over the task definitions in tasks/.
#
#   lint  - pure-Python schema check, seconds, always runs.
#   tasks - per-task container check: the bootstrap must produce the state it
#           claims, and the verifier must award NOTHING without an agent. A
#           verifier that goes green on the untouched image is vacuous - it
#           would score every model 100% on that task while measuring nothing.
#           Since the reward is now a fraction (tests/test.sh awards partial
#           credit from the CTRF report), the same job also re-measures the
#           set of tests that pass with no agent -- the floor that fraction
#           excludes -- and fails if the committed
#           tasks/<task>/tests/vacuity_floor.json names a different set.
#
# Deliberately *not* here: running reference solutions. That needs a solution
# per task, which does not exist yet. These two gates catch the failure modes
# that are cheap to catch.

on:
  pull_request:
    paths:
      - 'tasks/**'
      - 'scripts/lint_tasks.py'
      - 'scripts/vacuity_floor.py'
      - '.github/workflows/tasks.yml'
  workflow_dispatch:
  schedule:
    # Nightly at 07:00 UTC. PRs only exercise changed tasks, so this is what
    # catches breakage that comes from outside the repo (a moved jj release
    # tarball, a shifted ubuntu:24.04 base image, an apt package that vanished).
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: schema lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships Python 3.12, so tomllib is in the stdlib.
      - name: Lint task definitions
        run: python3 scripts/lint_tasks.py

  prepare:
    name: select tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base to diff a PR against its target branch.
          fetch-depth: 0

      - name: Select task matrix
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          all_tasks() {
            # Every directory under tasks/ is a task. The prompt-variant arms
            # (tasks/<base>_terse/) used to be filtered out here as provably
            # redundant container jobs; they were deleted once their register
            # was adopted by the base tasks, so there is nothing left to skip.
            find tasks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          }

          if [ "$EVENT" = "pull_request" ]; then
            # Only the tasks this PR actually touches. If the linter itself or
            # this workflow changed, the blast radius is every task, so run all.
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            # grep -q exits on the first match, so piping a large "$changed"
            # into it kills echo with SIGPIPE and pipefail turns the whole
            # pipeline non-zero -- the escalation silently never fires.
            if grep -qE '^(scripts/lint_tasks\.py|scripts/vacuity_floor\.py|\.github/workflows/tasks\.yml)$' <<<"$changed"; then
              echo "shared tooling changed -> running every task"
              selected=$(all_tasks)
            else
              selected=$(echo "$changed" \
                | sed -n 's#^tasks/\([^/]*\)/.*#\1#p' \
                | sort -u)
            fi
          else
            # schedule / workflow_dispatch: the full sweep.
            selected=$(all_tasks)
          fi

          # Drop names that no longer exist on disk (a PR that deletes a task).
          kept=""
          for t in $selected; do
            [ -d "tasks/$t" ] && kept="$kept$t"$'\n'
          done
          kept=$(printf '%s' "$kept" | sed '/^$/d')

          count=$(printf '%s' "$kept" | grep -c . || true)
          echo "selected $count task(s):"
          printf '%s\n' "$kept"

          # jq -R -s -c 'split("\n") | map(select(length > 0))' turns the
          # newline list into the JSON array fromJson() wants below.
          json=$(printf '%s' "$kept" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tasks=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  tasks:
    name: ${{ matrix.task }}
    needs: prepare
    # Skip cleanly when a PR touched nothing under tasks/.
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One report per broken task beats one report and 52 cancellations.
      max-parallel: 6
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build task environment
        run: docker build -t task-img tasks/${{ matrix.task }}/environment

      # The tests address absolute paths inside the image (/home/user/repo),
      # so mount only the test file in and let it look at the real container.
      # pytest comes from the image itself now, so there is no extra layer to
      # build and nothing to fetch.
      - name: Bootstrap check - test_initial_state.py must PASS
        run: |
          docker run --rm --network none \
            -v "$PWD/tasks/${{ matrix.task }}/bootstrap/test_initial_state.py:/verify/test_initial_state.py:ro" \
            task-img \
            python3 -m pytest /verify/test_initial_state.py -rA

      # The point of the whole workflow. No agent has run, so the verifier is
      # looking at the untouched bootstrap state and MUST reject it. If it
      # passes, the task scores every model 100% while measuring nothing.
      #
      # This drives tests/test.sh, the same entry point harbor copies to
      # /tests/test.sh and executes, rather than calling pytest directly -- so
      # a break in the script itself is caught here too. --network none is what
      # the sweep does as well ([verifier] network_mode = "no-network" in
      # task.toml); if verification ever regrows a network dependency, this
      # step fails instead of quietly working in CI and flaking in the sweep.
      #
      # test.sh exits 0 whether the tests passed or failed -- harbor reads the
      # verdict out of /logs/verifier/reward.txt -- so that is what we assert
      # on. A missing reward.txt means the script never got that far.
      - name: Vacuity check - the verifier must award ZERO with no agent
        run: |
          logs=$(mktemp -d)
          # Two task images run as an unprivileged user, so /logs must be
          # writable by anyone.
          chmod 777 "$logs"
          # test.sh exits non-zero only when it could not turn the run into a
          # reward at all, so capture the code instead of letting `bash -e`
          # abort here with no diagnosis.
          code=0
          docker run --rm --network none \
            -v "$PWD/tasks/${{ matrix.task }}/tests:/tests:ro" \
            -v "$logs:/logs" \
            task-img \
            bash /tests/test.sh || code=$?
          if [ ! -f "$logs/verifier/reward.txt" ]; then
            echo "::error title=Verifier did not run::tasks/${{ matrix.task }}/tests/test.sh produced no /logs/verifier/reward.txt."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error title=Verifier could not score::tasks/${{ matrix.task }}/tests/test.sh exited $code, which it only does when it never reached a verdict: $(cat "$logs/verifier/verifier_error.txt" 2>/dev/null)"
            exit 1
          fi
          if [ ! -f "$logs/verifier/ctrf.json" ]; then
            echo "::error title=No CTRF report::tasks/${{ matrix.task }}/tests/test.sh produced no /logs/verifier/ctrf.json, so a sweep would score this task 0 with no error."
            exit 1
          fi
          reward=$(cat "$logs/verifier/reward.txt")
          # Numeric, not a string compare. The reward is a float now, so an
          # honest zero can arrive as "0", "0.0" or "0.000000" and the old
          # [ "$reward" != "0" ] would reject two of the three. The assertion
          # itself is unchanged in meaning: any credit awarded on the untouched
          # bootstrap image is credit every model collects for free.
          if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) == 0.0 else 1)' "$reward"; then
            echo "::error title=Vacuous verifier::tasks/${{ matrix.task }}/tests/test_final_state.py earns reward $reward on the untouched bootstrap image. With no agent the reward must be exactly 0. If some of its assertions legitimately hold in the bootstrap state, they belong in the measured floor: run scripts/vacuity_floor.py --write --task ${{ matrix.task }}."
            exit 1
          fi
          # The floor file is what makes the assertion above satisfiable, so it
          # has to be audited too, against this very run. The comparison is on
          # test NAMES: a verifier weakened so that a different test now passes
          # on an untouched repo is score inflation on every model even though
          # the count did not move, and nothing else in CI would notice.
          python3 scripts/vacuity_floor.py --check \
            --task "${{ matrix.task }}" --ctrf "$logs/verifier/ctrf.json"
          echo "OK: verifier awarded no credit for the no-agent state with no network (reward $reward)."
