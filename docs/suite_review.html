<title>The jj suite: prompts and grading</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  color-scheme: light;
  --bg:#f2f4f4; --panel:#ffffff; --panel-2:#e9edee; --sunk:#eaeeee;
  --ink:#14181a; --ink-2:#465055; --ink-3:#6f7c82;
  --rule:#d5dbdc; --rule-soft:#e3e8e9;
  --accent:#0c6e70; --accent-soft:#dbeceb;
  --amber:#8a5a00; --amber-soft:#f5e9d2;
  --rose:#a52a37; --rose-soft:#f7e2e3;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1113; --panel:#161a1c; --panel-2:#1d2325; --sunk:#111517;
    --ink:#e7edef; --ink-2:#a6b2b6; --ink-3:#77848a;
    --rule:#272f32; --rule-soft:#1f2629;
    --accent:#4ecdc9; --accent-soft:#123033;
    --amber:#e2a63c; --amber-soft:#2e2513;
    --rose:#ff9095; --rose-soft:#331a1d;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1113; --panel:#161a1c; --panel-2:#1d2325; --sunk:#111517;
  --ink:#e7edef; --ink-2:#a6b2b6; --ink-3:#77848a;
  --rule:#272f32; --rule-soft:#1f2629;
  --accent:#4ecdc9; --accent-soft:#123033;
  --amber:#e2a63c; --amber-soft:#2e2513;
  --rose:#ff9095; --rose-soft:#331a1d;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

.shell{display:grid; grid-template-columns:300px minmax(0,1fr); height:100vh}
.rail{border-right:1px solid var(--rule); background:var(--panel); overflow-y:auto;
      overscroll-behavior:contain; display:flex; flex-direction:column}
.stage{overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth}

.brand{padding:20px 20px 16px; border-bottom:1px solid var(--rule); display:flex;
       flex-direction:column; gap:8px}
.brand h1{margin:0; font-size:16px; line-height:1.25; font-weight:640; letter-spacing:-.01em}
.tally{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px}
.tally span{font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  text-transform:uppercase; padding:3px 7px; border-radius:3px;
  border:1px solid var(--rule); color:var(--ink-2); background:var(--panel-2)}
.tally .t-ship{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.tally .t-prop{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}

.idx{padding:10px 10px 32px; display:flex; flex-direction:column; gap:2px}
.grp{margin:14px 0 4px; padding:0 10px; display:flex; align-items:baseline; gap:8px}
.grp .gname{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
            text-transform:uppercase; color:var(--ink-3)}
.grp .gcount{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
             margin-left:auto; font-variant-numeric:tabular-nums}
.grp.g-ship .gname{color:var(--accent)}
.grp.g-prop .gname{color:var(--amber)}

button.item{width:100%; text-align:left; display:grid; grid-template-columns:14px minmax(0,1fr);
  gap:8px; align-items:baseline; padding:6px 10px 7px; border:0; border-radius:5px;
  background:transparent; color:var(--ink-2); font:inherit; cursor:pointer; position:relative}
button.item:hover{background:var(--panel-2); color:var(--ink)}
button.item .glyph{font-size:11px; line-height:1.5; color:var(--ink-3)}
button.item .nm{font-family:var(--mono); font-size:12.5px; line-height:1.45; word-break:break-word}
button.item.on{background:var(--panel-2); color:var(--ink)}
button.item.on::before{content:""; position:absolute; left:0; top:5px; bottom:5px;
  width:2px; border-radius:2px; background:var(--accent)}
button.item.sec-proposed .glyph{color:var(--amber)}
button.item.sec-proposed.on::before{background:var(--amber)}
button.item .icode{color:var(--amber); font-weight:600}

.pane{max-width:860px; margin:0 auto; padding:0 40px 96px}
.taskhead{position:sticky; top:0; z-index:5; background:var(--bg);
  padding:22px 0 14px; border-bottom:1px solid var(--rule);
  display:flex; flex-direction:column; gap:10px}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:10px}
.eyebrow .sec-ship{color:var(--accent)}
.eyebrow .sec-prop{color:var(--amber)}
.titlerow{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
h2.tname{margin:0; font-family:var(--mono); font-size:21px; line-height:1.25; font-weight:600;
  letter-spacing:-.015em; word-break:break-word; flex:1 1 320px; min-width:0}
h2.tname .code{color:var(--amber)}
.nav{display:flex; align-items:center; gap:8px; margin-left:auto}
.nav button{font:inherit; font-family:var(--mono); font-size:12px; padding:5px 11px;
  border-radius:5px; border:1px solid var(--rule); background:var(--panel);
  color:var(--ink-2); cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.nav button:disabled{opacity:.4; cursor:default}
.counter{font-family:var(--mono); font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.kbd{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:1px 4px}

.body{display:flex; flex-direction:column; gap:20px; padding-top:24px}
.prose{margin:0; color:var(--ink-2); max-width:70ch; line-height:1.62}
.prose strong{color:var(--ink); font-weight:600}
.prose code, .metaline code{font-family:var(--mono); font-size:.9em;
  background:var(--panel-2); border:1px solid var(--rule-soft); border-radius:3px; padding:0 4px}

pre.prompt{margin:0; padding:16px 18px; background:var(--sunk);
  border:1px solid var(--rule-soft); border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0; overflow-x:auto; color:var(--ink);
  font-family:var(--mono); font-size:13.5px; line-height:1.6;
  white-space:pre-wrap; word-wrap:break-word; tab-size:2}
pre.prompt.proposedp{border-left-color:var(--amber)}

.metaline{font-family:var(--mono); font-size:12px; color:var(--ink-3);
  border-top:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft);
  padding:8px 0; letter-spacing:.01em}
.hole{border-left:3px solid var(--rose); background:var(--panel);
  border:1px solid var(--rule); border-left:3px solid var(--rose);
  border-radius:0 6px 6px 0; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.hole .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--rose)}
.note{border:1px solid var(--rule); border-left:3px solid var(--amber);
  border-radius:0 6px 6px 0; background:var(--panel); padding:12px 14px;
  display:flex; flex-direction:column; gap:6px}
.note .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--amber)}
.explainer{border:1px solid var(--rule); border-radius:6px; background:var(--panel);
  padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.explainer h3{margin:0; font-size:14px; font-weight:640; color:var(--ink)}

table.demoted{border-collapse:collapse; width:100%; font-size:13.5px}
table.demoted th{text-align:left; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:1px solid var(--rule); padding:8px 12px 8px 0; font-weight:500}
table.demoted td{border-bottom:1px solid var(--rule-soft); padding:10px 12px 10px 0;
  color:var(--ink-2); vertical-align:top}
table.demoted td.nm{font-family:var(--mono); color:var(--ink); white-space:nowrap}
table.demoted td.n{font-family:var(--mono); white-space:nowrap;
  font-variant-numeric:tabular-nums}

.readme{display:flex; flex-direction:column; gap:14px; padding:26px 0 0;
  border-bottom:1px solid var(--rule); margin-bottom:6px}
.readme h2{margin:0; font-size:13px; font-family:var(--mono); letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500}

footer.pagefoot{margin-top:36px; padding-top:18px; border-top:1px solid var(--rule);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-3)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
}
@media (max-width: 900px){
  .shell{grid-template-columns:1fr; height:auto; min-height:100vh}
  .rail{border-right:0; border-bottom:1px solid var(--rule); max-height:42vh;
        position:sticky; top:0; z-index:20}
  .pane{padding:0 20px 72px}
  .taskhead{position:static}
  h2.tname{font-size:18px}
}

#preamble{padding:12px 14px 18px; border-bottom:1px solid var(--rule);
  display:flex; flex-direction:column; gap:6px}
#preamble details{border:1px solid var(--rule-soft); border-radius:5px; background:var(--panel-2)}
#preamble summary{cursor:pointer; padding:6px 10px; font-family:var(--mono);
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
#preamble details[open] summary{color:var(--accent)}
#preamble .prose{padding:0 10px 10px; font-size:12.5px; line-height:1.55}
</style>

<script id="suite-data" type="application/json">{"title": "The jj suite: prompts and grading", "intro": "Every task's prompt, and what its verifier actually checks. The suite is **24 tasks**; the **14** written up below are the ones that survived the cut. The ten authored since were built from the designs listed under *Proposed* and ship alongside them, but are not reviewed here yet. Plus **7 cut**. Generated by `docs/build_suite_review.py`, which writes this file and `docs/suite_review.html` in the same run; prompts and test counts are read from `tasks/` at build time, not stored.", "preamble": [{"label": "Scoring", "body": "A verifier is a set of pytest assertions. Any test that passes on the untouched image with no agent is **floored** — measured, not declared, by `scripts/vacuity_floor.py` — and is excluded from both sides of the fraction, so the reward is *(scored tests passed) / (scored tests)*. A floored test still has to pass: if pytest exits non-zero for any reason the reward is capped strictly below 1.0, so a failing floored guard caps a correct solve without otherwise penalising it. A no-agent run scores 0 on every task by construction — the only tests it passes are the floored ones, so its numerator is empty."}, {"label": "Anchored", "body": "Before the agent runs, the harness measures the untouched image and records the change ids the bootstrap gave each commit, the per-workspace working-copy keys and the handover operation id. A verifier is **anchored** when its assertions are phrased in those recorded ids rather than in descriptions, positions or bookmarks — which is what stops a repository rebuilt from `root()` collecting full marks. *With exemptions* means the task ships an `anchor_exemptions.json` naming the specific commits the asked-for work is allowed to remove. In cold CI there is no anchor file and each check falls back to what it asserted before, saying out loud that no identity claim was made."}, {"label": "The proposed nine", "body": "The s ommit_still_described_as_the_target", "test_target_commit_survived"]}, {"kind": "built", "section": "shipping", "slug": "template_customize_log_output", "name": "template_customize_log_output", "prompt": "add a template alias called log_custom that prints each commit's short change id, then \" | \", then the first line of its description, one commit per line", "grading": "Neither test grades a commit; the task carries no anchored claim of its own. `jj config get template-aliases.log_custom` must exit 0 and its value — after a real newline is normalised back to the two characters of an escape, so hand-written and `jj config set` forms compare equal — must name `change_id.short()`, `description.first_line()`, the ' | ' separator and a newline. The real assertion is the second: `jj log -r all() --no-graph -T log_custom` must render byte-identically to the verifier rendering the reference template over the same revisions, which is indifferent to quoting and to which config layer the alias lives in. That tolerance was written to fix a measured grader artifact: identical correct behaviour scored 1.0 hand-edited and 0.5 through `jj config set`.", "meta": "2 tests, 0 floored · not anchored · separates models", "hole": "Nothing anchors the graded object, and on jj 0.44 a template runtime error renders `\u003cError: …>` inline at exit 0 — both sides of the byte comparison would render it identically, so the render test can pass on garbage until an explicit `\u003cError:` rejection is added.", "floored": []}, {"kind": "built", "section": "shipping", "slug": "track_untracked_file", "name": "track_untracked_file", "prompt": "app.log is ignored but I need it tracked, commit as \"Track log file\", don't touch the ignore rules", "grading": "Everything is asserted about one commit: the change the bootstrap's working copy was sitting on, resolved through the anchor's reserved per-workspace key because its handover description was empty. That commit must list app.log in `jj file list` and its description must contain 'Track log file'. The floored third test byte-compares .gitignore against the bootstrap's exact contents both on disk and in that commit's tree. Nothing is positional — the previous version graded `@-`, which scored a correct `jj describe` finish 0 and a fabricated commit at `@-` a full 1.0.", "meta": "3 tests, 1 floored · anchored · separates models", "hole": "The byte-exact .gitignore check that catches the `!app.log` cheat is the floored one, so that cheat still passes both scored tests and is only capped below 1.0 rather than zeroed.", "floored": ["test_gitignore_unchanged"]}, {"kind": "built", "section": "shipping", "slug": "workspace_update_stale", "name": "workspace_update_stale", "prompt": "this workspace is stale — bring it up to date, then change config.json's status to \"active\" and commit that as \"Activate config\"", "grading": "All three assertions additionally require the commit they inspect to be, or to descend from, the change this workspace's working copy was sitting on at handover — which is where the other workspace's work landed, and which the docstring records as what killed a measured fabricate-from-`root()` solve that had scored 1.0. `jj st` must exit 0 in the project (a stale working copy exits 1 on the pinned jj); config.json must parse with status 'active' and the other workspace's `new` field preserved, both on disk and in the commit at `@-`; and that commit's description must contain 'Activate config'.", "meta": "3 tests, 0 floored · anchored · separates models", "hole": "The graded commit is `@-` by position, so a correct solve that finishes by describing the updated working copy in place fails two of the three scored tests. A redundant stderr grep for the word 'stale' also sits behind the exit-code check that already discriminates.", "floored": []}, {"kind": "built", "section": "shipping", "slug": "absorb_changes", "name": "absorb_changes", "prompt": "push the feature_a.py and feature_b.py fixes in my working copy down into whichever commit last touched each file, so the working copy ends up empty", "grading": "Graded as per-file placement, which is what distinguishes absorb from a wholesale squash. The anchored 'Initial commit' must touch feature_a.py in its own diff with the fix content there, and `{target}..@ & files(...)` must be empty so no later commit is still modifying that path; feature_b.py is the same test against the anchored 'Add feature A'. The third test requires `@` to be or to descend from that commit, to render `empty` and to have no changed paths — anchored by relation because the per-file `jj squash --into` route empties the handover `@` and jj abandons an emptied squash source.", "meta": "3 tests, 0 floored · anchored, with exemptions · provisional, held for coverage", "hole": "The content check is a substring of the fix marker, so hand-placing the right line into the right ancestor passes without `jj absorb` ever running — correct under R3, but it means the task cannot distinguish absorb from a careful manual squash.", "floored": []}, {"kind": "built", "section": "shipping", "slug": "undo_mistaken_rebase", "name": "undo_mistaken_rebase", "prompt": "rebase B onto base, then put the repo back exactly the way it was before that", "grading": "The operation log is replayed with `jj --at-op`, asking at each operation where the bootstrap's `B` change was sitting, as change ids. One scored test requires that at some recorded operation `B`'s only parent was the anchored `base`; the other requires that plus `B` sitting on `A` at the current operation with the `conflict` keyword false. The conjunction is deliberate: this task's correct end state IS its bootstrap state, so all four pure end-state assertions are in the vacuity floor and earn nothing. No route is named, so undo, op undo, op revert and op restore all qualify — the previous English-matching version mis-scored a throwaway rebase that never touched `B` at 1.0.", "meta": "6 tests, 4 floored · anchored · provisional, held for coverage", "hole": "Only two scored tests, so a single grader artifact halves the task; and the replay cannot tell a deliberately staged rebase-and-revert from a genuine mistake — only the anchor rules that out.", "floored": ["test_commits_survived", "test_file_contents_restored", "test_main_bookmark_restored", "test_topology_restored"]}, {"kind": "built", "section": "shipping", "slug": "operation_recovery", "name": "operation_recovery", "prompt": "Commit 3, Commit 4 and Commit 5 were a mistake — put the repo back to how it was right after I made Commit 2", "grading": "The recovered state is asserted commit by commit: file3/4/5.txt off disk and out of the tree of the anchored change the bootstrap went on to describe 'Commit 3', which must track exactly file1.txt and file2.txt; nothing described Commit 3, 4 or 5 visible, and the anchored Commit 4 and Commit 5 changes not resolving at all. Then `@` must BE that anchored 'Commit 3' change, render empty, be undescribed, and sit on the anchored 'Commit 2' — which is what separates going back to the earlier state from editing history forward into a similar-looking shape. Finally exactly four commits may be visible, and the three anchored changes must be among them.", "meta": "8 tests, 3 floored · anchored, with exemptions · provisional, held for coverage", "hole": "`@` must be exactly the recovered change, so a correct recovery that ends standing somewhere else loses a fifth of the reward; and the commit-id equality that would catch a rebuild-then-`op restore` is floored, so it earns nothing.", "floored": ["test_earlier_operations_are_still_recorded", "test_kept_commits_are_the_original_commits", "test_kept_files_present_with_original_contents"]}, {"kind": "built", "section": "shipping", "slug": "git_fetch_remote", "name": "git_fetch_remote", "prompt": "main has moved on origin — rebase feature onto the new main and push feature back up", "grading": "Both assertions are made in the bare remote with git plumbing, against a commit id computed from the working repository at verification time: the rebase preserves the change id and rewrites the commit id, so the expected value cannot be stored anywhere. The bootstrap's 'Feature commit' change is resolved by anchored change id, and `git rev-parse refs/heads/feature` in the remote must equal what it resolves to now. The second test adds that the remote has a `main`, that `feature` is not the same commit as it, and that main is an ancestor of feature — which together kill the measured `git branch feature main` cheat that scored 1.0 without running jj at all.", "meta": "2 tests, 0 floored · anchored · provisional, held for coverage", "hole": "The two scored tests overlap heavily — both assert the same equality — so the reward is close to pass/fail, and nothing asserts that a fetch ever happened.", "floored": []}, {"kind": "built", "section": "shipping", "slug": "workspace_add", "name": "workspace_add", "prompt": "set up a second workspace for this repo at /home/user/myproject-workspace2", "grading": "The load-bearing claim, re-run in all three tests, is that the new directory is backed by the project's own repository: the change id the anchor recorded for the project's handover working copy must resolve from inside it, which a separately-created repository cannot do whatever it is named. Around that: the directory exists and `jj workspace root` there prints it, `jj workspace list` in the project reports at least two workspaces with the anchored working copy among their targets and the new directory's own `@` among them, and a plain `jj status` — deliberately without `--ignore-working-copy` — succeeds there. The resolve-from-inside check is what closed the measured `jj git init` cheat that had scored 1.0.", "meta": "3 tests, 0 floored · anchored · provisional, held for coverage", "hole": "With no anchor file the identity claim degrades to 'the project's current `@` resolves inside the workspace', and one assertion compares `jj workspace root` stdout against a hardcoded path literal.", "floored": []}, {"kind": "proposed", "section": "proposed", "slug": "n1", "name": "N1 — a conflict that propagates instead of being resolved on the spot", "code": "N1", "headline": "a conflict that propagates instead of being resolved on the spot", "prompt": "The rebase of retry-backoff onto main left src/client/retry.py conflicted in 'make the retry budget configurable', and everything above it is carrying the conflict too. Fix it in that commit — keep main's renamed REQUEST_TIMEOUT and my RETRY_BUDGET setting — and leave the stack as the four commits it is now, each with the changes it has.", "grading": "**Setup:** retry-backoff's four commits have already been rebased onto a main that moved underneath them; the second of the four conflicts in src/client/retry.py because main renamed TIMEOUT in the same lines that commit added RETRY_BUDGET, and the two commits above it and the empty working copy all carry the propagated conflict. **Graded:** `conflicts()` empty across the whole repo, the four anchored change ids still resolving in the same order each carrying its own diff, no fifth commit between the anchored middle change and the anchored head, and retry.py at the head matching the single satisfying content line-wise. It discriminates the git-shaped model in which a conflict halts work and must be cleared before anything else happens — unpicking the stack commit by commit and landing a fixup on top both leave the anchored middle change conflicted.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "Naming REQUEST_TIMEOUT and RETRY_BUDGET pins the resolution so it can be graded, but it tells the agent what the conflict contains before it looks.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n2", "name": "N2 — a merge commit the agent creates", "code": "N2", "headline": "a merge commit the agent creates", "prompt": "I need rate-limit and oauth-refresh brought together: make a commit that sits on top of both, with config.toml carrying the [ratelimit] block from one and the [oauth] block from the other. Don't rewrite the commits on either bookmark.", "grading": "**Setup:** rate-limit and oauth-refresh diverge from main, their tips edit the same region of config.toml so they conflict textually, and there is no merge anywhere in the repo. **Graded:** `@` has exactly two parents whose change ids are exactly the two anchored tips, the merge renders `conflict == false`, config.toml holds both named blocks at the one satisfying content, and both tips still resolve to their bootstrap commit ids — unchanged commit ids, not merely surviving change ids, which is what kills the hand-written single-parent union. It discriminates hunting for a `jj merge` subcommand from knowing that a commit can simply have two parents.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "That there is no `jj merge` subcommand is marked 0.38-only in the provenance roster and has to be re-probed on 0.44 before authoring, since the whole discrimination assumes it.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n3", "name": "N3 — recovering from a mistake buried in the operation log", "code": "N3", "headline": "recovering from a mistake buried in the operation log", "prompt": "I squashed 'return 409 on duplicate keys' into 'add idempotency key to charge requests' by mistake, and I've made two more commits since then. Get those back to being two separate commits exactly as they were, without losing the work I did afterwards.", "grading": "**Setup:** two commits above main that should have stayed apart, which the bootstrap has already squashed together, plus two further commits of real work made afterwards so the mistake is neither the first nor the last entry in the operation log. **Graded:** both anchored change ids visible again as separate commits in their original order, each carrying its own diff; the two later anchored changes still resolving with their bootstrap commit ids intact; an `--at-op` replay confirming the recovered commits are the originals rather than reconstructions; and every divergence addressed through `change_id(X)` rather than a bare change-id revset or the literal X/0, X/1 offsets. It discriminates undoing the most recent operation (which reverses the changelog commit) and rewinding to a pre-mistake operation (which reaches a repository missing the later work) from reversing one operation out of the middle of the history.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "The correct route leaves a residual divergent change and legitimately drops a change id, so this will need an `anchor_exemptions.json` — and a green pre-sweep cannot reveal that it is missing, because the untouched image never does the work that breaks the assertion.", "explainer_title": "What this task sets up, and what it evaluates", "explainer": ["**The setup.** The agent is handed a repository with a mistake already baked into it and some work done on top of the mistake. On top of main there were two commits — one adding an idempotency key to charge requests, one returning 409 when a duplicate key shows up — and the bootstrap squashed the second into the first, so the repository now holds a single commit carrying both changes and the second commit's message is gone. The bootstrap then made two more commits, a retry-budget change and a changelog entry, so the mistake sits three operations back rather than being the last thing that happened.", "**A correct recovery** ends with those two commits separate again, carrying the same identities they had before the squash, and with the two later commits still present and unmodified.", "**The obvious moves each fail in their own way.** Undoing the most recent operation reverses the changelog commit instead of the squash. Rewinding the repository to the state it was in before the squash also erases the two later commits, because that is time travel rather than an inverse patch. Hand-splitting the combined commit back into two produces commits that look right in a log but are new ones, which the verifier can tell apart from the originals.", "**What is being evaluated** is whether the agent knows that jj's record of past operations lets you reverse one specific operation out of the middle of the history without disturbing what came after it — and, just as importantly, whether it can tell that apart from rewinding to an earlier point in time.", "**Why it earns a slot.** This is precisely where the model most people carry over from git breaks: git's reflog lets you go back to a state, and an agent reasoning by analogy will reach for the equivalent here and quietly destroy a day of work. The cost is invisible from the end state — the repository looks perfectly fine, it just has less in it — which is exactly why it has to be graded rather than eyeballed."]}, {"kind": "proposed", "section": "proposed", "slug": "n4", "name": "N4 — revsets the agent writes", "code": "N4", "headline": "revsets the agent writes", "prompt": "get the change ids of all the tips not yet part of main and put them in unmerged.txt, each id on its own line", "grading": "**Setup:** roughly sixteen commits across six lines of work — main, two already-landed bookmarks whose tips are ancestors of main, and four heads that are not — deliberately large and interleaved enough that reading the log and transcribing tips by eye is not a viable route. **Graded:** the reference revset is evaluated in the repo at verification time and unmerged.txt must equal that set of change ids exactly, so the expected answer never appears as a constant; every read passes `--ignore-working-copy` so the verifier does not snapshot what it is grading, and anchored ids confirm the history was not restructured to make a wrong answer true. Whether the agent composed a revset or worked it out by hand is not graded.", "meta": "design as written, since built · Hugh's wording, verbatim", "recast": null, "open_question": "An answer-file task invites a zero-tool-call guess, so some fraction of trials measures agency rather than jj skill; the proposal prefers a form where the revset is the route to an action rather than the deliverable.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n5", "name": "N5 — filesets", "code": "N5", "headline": "filesets", "prompt": "roll back the src/ changes but don't change the generated tree", "grading": "**Setup:** one commit, 'wire up the new charge client', touching both hand-written code under src/ and a regenerated tree nested under src/generated/, whose files carry machine-looking content with a recorded hash so they cannot be plausibly reconstructed — over-restoring and then re-adding them fails byte-equality. **Graded:** the anchored change's changed paths are exactly the generated set and nothing else, every file under src/generated/ matches the bootstrap byte for byte, and the change id survives the rewrite while the commit id changes, which is what distinguishes an in-place rewrite from a rebuilt commit. Doing it file by file also passes — the fileset is the cheap route, not the graded one. It discriminates a whole-directory restore, which silently takes the nested generated subtree with it.", "meta": "design as written, since built · Hugh's wording, verbatim", "recast": null, "open_question": "No survey theme backs this one, so standing the fixture up and solving it on the pinned binary is the first authoring action rather than a later check.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n6", "name": "N6 — immutability", "code": "N6", "headline": "immutability", "prompt": "jj is refusing to reword anything in my stack — it says the commits are immutable — and 'fix nonce handling' should say 'fix nonce handling on retried charges'. Sort it out so I can rewrite my own commits again, and keep main and everything below it protected from rewrites.", "grading": "**Setup:** main with two commits below it and a four-commit stack above, and an over-wide immutability alias the bootstrap has already configured through `jj config set --repo`, so the user's own stack is protected along with main and every rewrite in it is refused. **Graded:** the configured alias is evaluated in the repo and never string-matched — the anchored main change must still be inside it and the anchored stack commits must not — the anchored 'fix nonce handling' change carries the corrected description under the same change id with a new commit id, and the anchored commit below main is byte-identical to the bootstrap's. Both halves are scored, so narrowing the protection without doing the reword, and rewording while leaving main unprotected, each fail.", "meta": "design as written, since built · wording drafted", "recast": "Recast to a single functional ask after the 'two unrelated tasks' objection: the standalone 'set the repo up so nothing can be rewritten' errand is gone, and the agent now enters on a refusal it has to diagnose. That is also the defence against the risk in the original — a prompt that opens by asking for protection reads like branch protection and pulls toward git-side mechanisms (hooks, `receive.denyNonFastForwards`, read-only files) that jj never reads.", "open_question": "jj 0.44 silently accepts five config keys it removed — they exit 0, print nothing, list back happily and do nothing — so an agent that writes a plausible key sees no error and reports done. That is why the alias must be evaluated rather than read.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n7", "name": "N7 — the operation log as something you diagnose", "code": "N7", "headline": "the operation log as something you diagnose", "prompt": "Before I re-run the tests I need to know which commits actually changed when I rebased retry-backoff onto main — put their change ids in touched.txt, one per line.", "grading": "**Setup:** an operation log holding one multi-commit rebase — retry-backoff's four commits moved onto an advanced main — among several small operations made afterwards, so the rebase is not the most recent entry and has to be found. **Graded:** the operation's effect is recomputed at verification time by `--at-op` differencing, reading the repo at the operation and at its predecessor and taking the change-id delta, and touched.txt is compared as a set; the expected set is never a constant, so a guessed list of plausible ids cannot match. It discriminates guessing the touched set from `jj log`, which shows the current graph rather than what the operation changed.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "`--no-integrate-operation` and `jj op integrate` are real on 0.44, so an agent can produce side effects that leave no operation-log entry — which means a verifier reconstructing truth by `--at-op` differencing is reasoning over a log no longer guaranteed complete. The proposal wants this probed before N7 is authored.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n8", "name": "N8 — divergence as a thing to work with", "code": "N8", "headline": "divergence as a thing to work with", "prompt": "jj is showing 'add idempotency key to charge requests' twice and the idempotency bookmark is in a conflicted state. Keep the copy that has tests/test_charge.py in it, get rid of the other, and leave idempotency pointing at the one that survives.", "grading": "**Setup:** a bare origin alongside the repo; the change exists twice — the local side amended to also touch tests/test_charge.py, a colleague's rewrite of the same change fetched from the remote — so two visible commits share one change id and the idempotency bookmark is conflicted between the local and remote targets on the same log lines. **Graded:** exactly one commit matches `change_id(X)` and renders `divergent == false`, it is the side whose tree contains tests/test_charge.py, and the bookmark resolves unconflicted to it. Every revset must spell `change_id(X)` and `bookmarks(name)`, because a bare change-id revset errors on a divergent change and a bare bookmark name errors on a conflicted bookmark — this is a task whose own verifier is breakable by the exact trap it tests.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "The solve legitimately drops a change id, so it needs an `anchor_exemptions.json` that a green pre-sweep cannot tell you is missing — and the list of operations that legitimately drop one was measured on 0.38 and never re-measured on 0.44.", "explainer_title": null, "explainer": null}, {"kind": "proposed", "section": "proposed", "slug": "n9", "name": "N9 — duplicate a range", "code": "N9", "headline": "duplicate a range", "prompt": "The duplicate-key work — 'validate the idempotency key format' through 'add tests for duplicate keys' — needs to be on release/2.4 as well. Put copies of those commits there in the same order and leave the originals on main exactly where they are.", "grading": "**Setup:** a release/2.4 maintenance line branching off main several commits back, and on main a contiguous run of three commits with unrelated commits both above and below it, so copying the wrong span is a detectably different end state. **Graded:** one new commit per source commit, each carrying exactly its source's diff, in source order, descending from the anchored release/2.4 tip; the duplicates are minted by the solve so they have no anchored ids and are located structurally and matched to sources by diff rather than by description; and both anchored originals must be intact — same change ids, same commit ids, same parents. It discriminates cherry-picking one commit at a time and, more sharply, the model in which 'get these over there' means a rebase, which relocates the originals instead of copying them.", "meta": "design as written, since built · wording drafted", "recast": null, "open_question": "`duplicate_commit`, the task this absorbs, is one of three known grader artifacts in the current suite and the cause has not been isolated; the replacement must not inherit it.", "explainer_title": null, "explainer": null}, {"kind": "table", "section": "demoted", "slug": "demoted", "name": "Cut — 7 that measured nothing", "rows": [["bookmark_create_and_move", "Create `feature-x`, commit on top of it, move the bookmark to the new commit."], ["new_commit", "Build a linear three-commit chain from the current working copy."], ["new_insert", "Insert a commit between two existing ones and rebase the descendants onto it."], ["obslog_view", "Write a report of every version a change has ever pointed at, without disturbing the repository."], ["revert_file", "Discard one file's uncommitted changes, restore another from a bookmark, keep a third."], ["show_commit", "Write a script that prints a revision with a git-format diff, and capture two patches with it."], ["status_ignored", "Ignore a tracked file and untrack it without deleting it from disk."]]}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById("suite-data").textContent);
  var pages = DATA.pages;
  var cur = 0;

  var SEC = {
    shipping: {label:"Shipping now", cls:"sec-ship"},
    proposed: {label:"Proposed \u2014 since built", cls:"sec-prop"},
    demoted:  {label:"Cut \u2014 measured nothing", cls:"sec-dem"}
  };

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  /* `code` and **bold** become elements; everything else stays literal text. */
  function rich(node, text){
    var re = /`([^`]+)`|\*\*([^*]+)\*\*/g, last = 0, m;
    while((m = re.exec(text)) !== null){
      if(m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      node.appendChild(el(m[1] !== undefined ? "code" : "strong", null,
                          m[1] !== undefined ? m[1] : m[2]));
      last = re.lastIndex;
    }
    if(last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
    return node;
  }
  function prose(text){ return rich(el("p","prose"), text); }

  /* ---------------- index ---------------- */
  var idx = document.getElementById("idx"), buttons = [];

  function itemButton(t, i){
    var b = el("button","item sec-" + t.section);
    b.type = "button";
    b.setAttribute("data-i", String(i));
    b.appendChild(el("span","glyph", t.kind === "built" ? "\u25c9"
                                   : t.kind === "proposed" ? "\u25cb" : "\u25a4"));
    var nm = el("span","nm");
    if(t.kind === "proposed"){
      nm.appendChild(el("span","icode", t.code));
      nm.appendChild(document.createTextNode(" " + t.headline));
    } else {
      nm.textContent = t.name;
    }
    b.appendChild(nm);
    b.addEventListener("click", function(){ go(i); });
    buttons.push(b);
    return b;
  }
  function groupHead(cls, name, count){
    var h = el("div","grp " + cls);
    h.appendChild(el("span","gname", name));
    h.appendChild(el("span","gcount", String(count)));
    return h;
  }

  var bySec = {shipping:[], proposed:[], demoted:[]};
  pages.forEach(function(t,i){ bySec[t.section].push(i); });

  idx.appendChild(groupHead("g-ship","Shipping now", bySec.shipping.length));
  bySec.shipping.forEach(function(i){ idx.appendChild(itemButton(pages[i], i)); });
  idx.appendChild(groupHead("g-prop","Proposed \u00b7 since built", bySec.proposed.length));
  bySec.proposed.forEach(function(i){ idx.appendChild(itemButton(pages[i], i)); });
  idx.appendChild(groupHead("g-dem","Demoted", 7));
  bySec.demoted.forEach(function(i){ idx.appendChild(itemButton(pages[i], i)); });

  /* ---------------- stage ---------------- */
  var head = document.getElementById("taskhead");
  var body = document.getElementById("taskbody");
  var prevBtn = el("button", null, "\u2190 prev");
  prevBtn.type = "button"; prevBtn.id = "prev"; prevBtn.setAttribute("aria-label","Previous");
  var nextBtn = el("button", null, "next \u2192");
  nextBtn.type = "button"; nextBtn.id = "next"; nextBtn.setAttribute("aria-label","Next");

  function sectionBlurb(key){
    for(var i = 0; i < DATA.sections.length; i++){
      if(DATA.sections[i].key === key) return DATA.sections[i].blurb;
    }
    return "";
  }

  function renderHead(t, i){
    head.textContent = "";
    var eb = el("div","eyebrow");
    eb.appendChild(el("span", SEC[t.section].cls, SEC[t.section].label));
    head.appendChild(eb);

    var row = el("div","titlerow");
    var h2 = el("h2","tname");
    if(t.kind === "proposed"){
      h2.appendChild(el("span","code", t.code + " \u2014"));
      h2.appendChild(document.createTextNode(" " + t.headline));
    } else {
      h2.textContent = t.name;
    }
    row.appendChild(h2);

    var nav = el("div","nav");
    nav.appendChild(prevBtn);
    nav.appendChild(el("span","counter", (i+1) + " / " + pages.length));
    nav.appendChild(nextBtn);
    row.appendChild(nav);
    head.appendChild(row);
  }

  function metaLine(text){
    var d = el("div","metaline");
    d.textContent = text;
    return d;
  }
  function callout(cls, label, text){
    var d = el("div", cls);
    d.appendChild(el("div","lbl", label));
    d.appendChild(prose(text));
    return d;
  }

  function renderTask(t){
    var pre = el("pre","prompt" + (t.kind === "proposed" ? " proposedp" : ""));
    pre.textContent = t.prompt;
    body.appendChild(pre);

    if(t.recast) body.appendChild(callout("note","Recast", t.recast));
    body.appendChild(prose(t.grading));
    body.appendChild(metaLine(t.meta));
    if(t.hole) body.appendChild(callout("hole","Known hole", t.hole));
    if(t.open_question) body.appendChild(callout("note","Open question", t.open_question));
    if(t.explainer){
      var box = el("div","explainer");
      box.appendChild(el("h3", null, t.explainer_title));
      t.explainer.forEach(function(p){ box.appendChild(prose(p)); });
      body.appendChild(box);
    }
  }

  function renderTable(t){
    var tbl = el("table","demoted");
    var thead = el("thead"), tr = el("tr");
    ["task","what it asked"].forEach(function(h){ tr.appendChild(el("th", null, h)); });
    thead.appendChild(tr); tbl.appendChild(thead);
    var tb = el("tbody");
    t.rows.forEach(function(r){
      var row = el("tr");
      row.appendChild(el("td","nm", r[0]));
      row.appendChild(rich(el("td"), r[1]));
      tb.appendChild(row);
    });
    tbl.appendChild(tb);
    body.appendChild(tbl);
    body.appendChild(prose("Grading summaries and known holes for these seven are kept in "
      + "`docs/suite_review_data_built.json` rather than reproduced here; the task "
      + "directories themselves are recoverable at commit `73854f0b`, the last "
      + "commit before the cut."));
  }

  function render(){
    var t = pages[cur];
    renderHead(t, cur);
    body.textContent = "";

    /* The section blurb belongs to the section, not to the task, so it appears
       once - on the first page of its section - rather than on all fourteen. */
    if(cur === 0 || pages[cur - 1].section !== t.section){
      var intro = el("div","readme");
      intro.appendChild(prose(sectionBlurb(t.section)));
      body.appendChild(intro);
    }

    if(t.kind === "table") renderTable(t); else renderTask(t);

    buttons.forEach(function(b){
      b.classList.toggle("on", Number(b.getAttribute("data-i")) === cur);
    });
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === pages.length - 1;
    document.getElementById("stage").scrollTop = 0;
    var on = buttons[cur];
    if(on){
      var rail = document.querySelector(".rail");
      var rb = rail.getBoundingClientRect(), bb = on.getBoundingClientRect();
      if(bb.top < rb.top + 4 || bb.bottom > rb.bottom - 4){
        rail.scrollTop += (bb.top - rb.top) - (rb.height / 2) + (bb.height / 2);
      }
    }
  }

  function go(i, skipHash){
    if(i < 0 || i >= pages.length) return;
    cur = i;
    if(!skipHash){
      var h = "#" + pages[i].slug;
      if(location.hash !== h) history.replaceState(null, "", h);
    }
    render();
  }

  prevBtn.addEventListener("click", function(){ go(cur - 1); });
  nextBtn.addEventListener("click", function(){ go(cur + 1); });

  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    if(e.key === "ArrowRight" || e.key === "j"){ e.preventDefault(); go(cur + 1); }
    else if(e.key === "ArrowLeft" || e.key === "k"){ e.preventDefault(); go(cur - 1); }
    else if(e.key === "Home"){ e.preventDefault(); go(0); }
    else if(e.key === "End"){ e.preventDefault(); go(pages.length - 1); }
  });

  window.addEventListener("hashchange", function(){ fromHash(); });

  function fromHash(){
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if(!h) return false;
    for(var i = 0; i < pages.length; i++){
      if(pages[i].slug === h){ go(i, true); return true; }
    }
    return false;
  }

  /* the shared preamble, rendered once into the rail-adjacent header */
  var pre = document.getElementById("preamble");
  DATA.preamble.forEach(function(p){
    var d = el("details");
    var s = el("summary", null, p.label);
    d.appendChild(s);
    d.appendChild(prose(p.body));
    pre.appendChild(d);
  });

  if(!fromHash()) render();
})();
</script>
