<title>The 24-task jj suite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  color-scheme: light;
  --bg:#f2f4f4;
  --panel:#ffffff;
  --panel-2:#e9edee;
  --sunk:#eaeeee;
  --ink:#14181a;
  --ink-2:#465055;
  --ink-3:#6f7c82;
  --rule:#d5dbdc;
  --rule-soft:#e3e8e9;
  --accent:#0c6e70;
  --accent-soft:#dbeceb;
  --amber:#8a5a00;
  --amber-soft:#f5e9d2;
  --rose:#a52a37;
  --rose-soft:#f7e2e3;
  --violet:#5f46a0;
  --violet-soft:#e9e3f7;
  --shadow:0 1px 0 rgba(20,24,26,.05), 0 8px 24px -18px rgba(20,24,26,.5);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1113;
    --panel:#161a1c;
    --panel-2:#1d2325;
    --sunk:#111517;
    --ink:#e7edef;
    --ink-2:#a6b2b6;
    --ink-3:#77848a;
    --rule:#272f32;
    --rule-soft:#1f2629;
    --accent:#4ecdc9;
    --accent-soft:#123033;
    --amber:#e2a63c;
    --amber-soft:#2e2513;
    --rose:#ff9095;
    --rose-soft:#331a1d;
    --violet:#b6a0f2;
    --violet-soft:#221d33;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 10px 30px -22px #000;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1113;
  --panel:#161a1c;
  --panel-2:#1d2325;
  --sunk:#111517;
  --ink:#e7edef;
  --ink-2:#a6b2b6;
  --ink-3:#77848a;
  --rule:#272f32;
  --rule-soft:#1f2629;
  --accent:#4ecdc9;
  --accent-soft:#123033;
  --amber:#e2a63c;
  --amber-soft:#2e2513;
  --rose:#ff9095;
  --rose-soft:#331a1d;
  --violet:#b6a0f2;
  --violet-soft:#221d33;
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 10px 30px -22px #000;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:312px minmax(0,1fr); height:100vh}
.rail{
  border-right:1px solid var(--rule);
  background:var(--panel);
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex; flex-direction:column;
}
.stage{overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth}

/* ---------- rail head ---------- */
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:8px}
.brand h1{
  margin:0; font-size:16px; line-height:1.25; font-weight:640; letter-spacing:-.01em; text-wrap:balance;
}
.brand .sub{margin:0; font-size:12.5px; color:var(--ink-3); line-height:1.45}
.tally{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px}
.tally span{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 7px; border-radius:3px; border:1px solid var(--rule); color:var(--ink-2); background:var(--panel-2);
}
.tally .t-ship{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.tally .t-prop{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}

/* ---------- index ---------- */
.idx{padding:10px 10px 32px; display:flex; flex-direction:column; gap:2px}
.grp{margin:14px 0 4px; padding:0 10px; display:flex; align-items:baseline; gap:8px}
.grp .gname{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}
.grp .gcount{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums}
.grp.g-ship .gname{color:var(--accent)}
.grp.g-prop .gname{color:var(--amber)}
details.demoted-wrap{margin-top:14px}
details.demoted-wrap>summary{
  list-style:none; cursor:pointer; padding:4px 10px; display:flex; align-items:center; gap:8px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-radius:4px;
}
details.demoted-wrap>summary::-webkit-details-marker{display:none}
details.demoted-wrap>summary:hover{background:var(--panel-2); color:var(--ink-2)}
details.demoted-wrap>summary .chev{transition:transform .15s ease; display:inline-block; font-size:9px}
details.demoted-wrap[open]>summary .chev{transform:rotate(90deg)}
details.demoted-wrap>summary .gcount{margin-left:auto; font-variant-numeric:tabular-nums}

button.item{
  width:100%; text-align:left; display:grid; grid-template-columns:14px minmax(0,1fr); gap:8px; align-items:baseline;
  padding:6px 10px 7px; border:0; border-radius:5px; background:transparent; color:var(--ink-2);
  font:inherit; cursor:pointer; position:relative;
}
button.item:hover{background:var(--panel-2); color:var(--ink)}
button.item .glyph{font-size:11px; line-height:1.5; color:var(--ink-3)}
button.item .nm{font-family:var(--mono); font-size:12.5px; line-height:1.45; word-break:break-word}
button.item .tag{
  display:block; font-size:11px; color:var(--ink-3); margin-top:2px; line-height:1.35;
}
button.item.on{background:var(--panel-2); color:var(--ink)}
button.item.on::before{
  content:""; position:absolute; left:0; top:5px; bottom:5px; width:2px; border-radius:2px; background:var(--accent);
}
button.item.sec-proposed .glyph{color:var(--amber)}
button.item.sec-proposed.on::before{background:var(--amber)}
button.item .icode{color:var(--amber); font-weight:600}
button.item.is-struck .icode{color:var(--rose)}
button.item.is-struck .nm{text-decoration:line-through; text-decoration-thickness:1px}
button.item.is-struck .glyph{color:var(--rose)}
button.item.is-struck.on::before{background:var(--rose)}
button.item .dots{display:inline-flex; gap:4px; margin-left:6px; vertical-align:middle}
button.item .dot{width:5px; height:5px; border-radius:50%; display:inline-block}
.dot-prov{background:var(--violet)}
.dot-terse{background:var(--accent)}

/* ---------- stage ---------- */
.pane{max-width:900px; margin:0 auto; padding:0 40px 96px}

.taskhead{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:22px 0 14px; border-bottom:1px solid var(--rule);
  display:flex; flex-direction:column; gap:10px;
}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  display:flex; align-items:center; gap:10px;
}
.eyebrow .sec-ship{color:var(--accent)}
.eyebrow .sec-prop{color:var(--amber)}
.eyebrow .sec-dem{color:var(--ink-3)}
.titlerow{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
h2.tname{
  margin:0; font-family:var(--mono); font-size:22px; line-height:1.2; font-weight:600; letter-spacing:-.015em;
  word-break:break-word; flex:1 1 320px; min-width:0;
}
h2.tname.struck{text-decoration:line-through; text-decoration-thickness:1.5px; color:var(--rose)}
h2.tname .code{color:var(--amber)}
h2.tname.struck .code{color:var(--rose)}
.subhead{font-family:var(--sans); font-size:15px; color:var(--ink-2); margin:-2px 0 0; font-weight:400; line-height:1.4}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 8px; border-radius:3px; border:1px solid; white-space:nowrap;
}
.chip-built{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.chip-proposed{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}
.chip-prov{color:var(--violet); border-color:var(--violet); background:var(--violet-soft)}
.chip-struck{color:var(--rose); border-color:var(--rose); background:var(--rose-soft)}
.chip-quiet{color:var(--ink-3); border-color:var(--rule); background:var(--panel-2)}

.nav{display:flex; align-items:center; gap:8px; margin-left:auto}
.nav button{
  font:inherit; font-family:var(--mono); font-size:12px; padding:5px 11px; border-radius:5px;
  border:1px solid var(--rule); background:var(--panel); color:var(--ink-2); cursor:pointer;
}
.nav button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.nav button:disabled{opacity:.4; cursor:default}
.counter{font-family:var(--mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.kbd{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:1px 4px}

/* ---------- body blocks ---------- */
.body{display:flex; flex-direction:column; gap:26px; padding-top:26px}
.blk{display:flex; flex-direction:column; gap:10px}
.blabel{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.blabel .flag{
  text-transform:none; letter-spacing:0; font-size:11px; padding:2px 7px; border-radius:3px; border:1px solid;
}
.flag-amber{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}
.flag-accent{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.flag-quiet{color:var(--ink-3); border-color:var(--rule); background:var(--panel-2)}
.prose{margin:0; color:var(--ink-2); max-width:68ch; line-height:1.62}
.prose strong{color:var(--ink); font-weight:600}

pre.prompt{
  margin:0; padding:18px 20px; background:var(--sunk); border:1px solid var(--rule-soft); border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0; overflow-x:auto; color:var(--ink);
  font-family:var(--mono); font-size:13px; line-height:1.62; white-space:pre-wrap; word-wrap:break-word; tab-size:2;
}
pre.prompt.terse{border-left-color:var(--violet); background:var(--panel-2)}
pre.prompt.proposedp{border-left-color:var(--amber)}
.prompt-pair{display:flex; flex-direction:column; gap:18px}

.meta{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--rule-soft); border:1px solid var(--rule-soft); border-radius:6px; overflow:hidden;
}
.meta .cell{background:var(--panel); padding:12px 14px; display:flex; flex-direction:column; gap:4px}
.meta .k{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.meta .v{font-family:var(--mono); font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.3}
.meta .v.no{color:var(--ink-3)}
.meta .v.yes{color:var(--accent)}
.meta .v.warn{color:var(--amber)}

ul.floored{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:4px}
ul.floored li{font-family:var(--mono); font-size:12px; color:var(--ink-2); display:flex; gap:8px}
ul.floored li::before{content:"⌞"; color:var(--ink-3)}

.callout{
  border:1px solid var(--rule); border-left:3px solid var(--ink-3); border-radius:0 6px 6px 0;
  background:var(--panel); padding:14px 16px; display:flex; flex-direction:column; gap:8px;
}
.callout.holes{border-left-color:var(--rose)}
.callout.holes .blabel{color:var(--rose)}
.callout.verify{border-left-color:var(--amber)}
.callout.verify .blabel{color:var(--amber)}
.callout.struck{border-left-color:var(--rose); background:var(--rose-soft)}
.callout.stage-note{border-left-color:var(--amber); background:var(--amber-soft)}
.callout .prose{color:var(--ink-2)}
.callout.struck .prose, .callout.stage-note .prose{color:var(--ink)}

code, .mono{font-family:var(--mono); font-size:.92em}
.prose code{background:var(--panel-2); border:1px solid var(--rule-soft); border-radius:3px; padding:0 4px}

.sectionmark{
  display:flex; flex-direction:column; gap:6px; padding:22px 0 0;
}
footer.pagefoot{
  margin-top:36px; padding-top:18px; border-top:1px solid var(--rule);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-3);
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
}

@media (max-width: 900px){
  .shell{grid-template-columns:1fr; height:auto; min-height:100vh}
  .rail{border-right:0; border-bottom:1px solid var(--rule); max-height:44vh; position:sticky; top:0; z-index:20}
  .pane{padding:0 20px 72px}
  .taskhead{position:static}
  h2.tname{font-size:19px}
}
</style>

      </footer>

</div>

<script id="suite-data" type="application/json">{"caveat": "None of these ten tasks exist yet — every prompt, fixture and grading rule below is a design sketch from docs/suite_redesign_proposal.md, not a built task: no bootstrap has been stood up on jj 0.44, no verifier has been written, and the proposal's own R7 forbids writing any of these verifiers until a genuine solve has been run against the pinned binary first.", "items": [{"name": "abandon_commits", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§3 keep table: the incidental `@` pin at tests/test_final_state.py:186-190 needs the mechanical relaxation (prerequisite 1).", "prompt_verbatim": "# Abandoning Commits in Jujutsu\n\n## Background\nYou are working in a `jj` repository and have created a stack of commits. You've realized that some of the intermediate commits are false starts and need to be removed from the history. Removing a commit from the middle of a stack leaves its descendants in place, rebased onto the removed commit's parent.\n\n## Repository State\n- `commit A`: adds `a.txt`. Bookmark: `feature-a`.\n- `commit B`: adds `b.txt`. Bookmark: `experiment`.\n- `commit C`: adds `c.txt`. Bookmark: `draft`.\n- `commit D`: adds `d.txt`. Working copy is here.\n\n## Requirements\n1. Abandon the commit pointed to by the `experiment` bookmark, but **retain** the bookmark: afterwards it must still exist and point at the abandoned commit's parent.\n2. Abandon the commit pointed to by the `draft` bookmark. Do **not** retain this bookmark (it should be deleted).\n3. Set the description of the current working-copy commit to `cleanup complete`.\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Use only `jj` commands.", "prompt_style": "spec", "grading": "Four assertions, all against repository state. On disk: a.txt and d.txt present, b.txt and c.txt gone; and the anchored handover working-copy commit must track exactly ['a.txt', 'd.txt'], so the two abandons really took their files with them. The `experiment` bookmark must resolve to exactly the change id the bootstrap gave `commit A`, and the `draft` bookmark must no longer resolve at all while the bootstrap's `commit C` change is no longer visible anywhere. Commits are identified by anchored change id (`change_id_or_fallback`) and by the anchor's per-workspace working-copy key (`working_copy_or_fallback`), never by position — except that the last test additionally requires `@` to still BE the anchored handover change. No assertion reads jj's English: the only text read is the working copy's description, which is substring-checked for 'cleanup complete', text the instruction itself mandates the agent write. The fabrication guard is the shared session-scoped anchor fixture (every bootstrap change id still visible and non-divergent, and the handover operation id still in the op log), relaxed by an anchor_exemptions.json naming `commit B` and `commit C` as commits the asked-for work removes.", "scoring": "4 tests, 0 floored, 4 scored. Partial credit is k/4 for k scored tests passed, with a hard cap of 0.75 whenever pytest exits non-zero — a full 1.0 requires every test to pass. A no-agent run on the untouched image scores 0: nothing is floored, so its numerator is empty by construction.", "anchored": true, "anchor_exemptions": true, "tests_total": 4, "tests_floored": 0, "tests_scored": 4, "floored_test_names": [], "weaknesses": "test_working_copy_description still requires `@` to be exactly the handover change, so a correct solve that ends with a fresh `jj new` on top loses a quarter of the reward.", "section": "shipping", "slug": "abandon_commits"}, {"name": "edit_commit_message", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§3 keep table: the `@` pin is incidental and is one of the ten to relax under prerequisite 1.", "prompt_verbatim": "# Edit Commit Message in Jujutsu\n\n## Background\nJujutsu (`jj`) is a modern VCS that makes it easy to modify the history of a repository. It allows editing the commit message (description) of any commit in the history without checking it out, and automatically rebases descendants.\n\n## Requirements\n- Find the commit with the description \"Add file B\" in the repository history.\n- Change its description to \"Add second file\".\n- Create a new commit on top of the current working copy with the description \"Add file D\" and add a new file `d.txt` containing the text \"d\".\n\n## Constraints\n- Project path: /home/user/repo", "prompt_style": "spec", "grading": "Three scored assertions. The renamed commit is the one the bootstrap described 'Add file B', resolved by its anchored change id, and its description must contain 'Add second file'. The new commit has no anchored id of its own — the agent creates it — so it is anchored by relation: `@`'s parent change ids must be exactly the anchored 'Add file C' change, and only then is `@`'s description required to contain 'Add file D'. The third test repeats that parent claim and then reads d.txt off disk, requiring the content 'd'. So commits are identified by anchored change id and by parent relation to an anchored commit; `@` itself is used positionally as 'the new commit', which is the one position the task fixes. Nothing reads jj's English output; the only substrings matched are the descriptions the instruction tells the agent to write. The guard is the shared anchor fixture with no exemption file — every bootstrap commit must still resolve — plus the anchored-parent claim, which the docstring records as what killed a measured `jj new -r 'root()'` rebuild that had scored 1.0.", "scoring": "4 tests, 1 floored (test_commit_c_still_exists, which resolves by `files(\"c.txt\")` and is unanchored), 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all four to pass. A no-agent run scores 0 — the floored test passes but is excluded from both sides of the fraction.", "anchored": true, "anchor_exemptions": false, "tests_total": 4, "tests_floored": 1, "tests_scored": 3, "floored_test_names": ["test_final_state.py::test_commit_c_still_exists"], "weaknesses": "`@` must literally be the new 'Add file D' commit, so a correct solve that finishes with an extra `jj new` fails two of the three scored tests.", "section": "shipping", "slug": "edit_commit_message"}, {"name": "rebase_branch", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": null, "prompt_verbatim": "# Rebase a Bookmark and Resolve Conflicts in jj\n\n## Background\nJujutsu (`jj`) is a Git-compatible VCS that treats the working copy as a permanent commit and has first-class conflict management. In this task, you will rebase a bookmark (branch) onto `main` and resolve a conflict.\n\n## Requirements\n- You have an initialized `jj` repository at `/home/user/repo`.\n- The `main` bookmark has been updated with a new commit modifying `data.txt`.\n- You have a bookmark `feature-branch` with 2 commits. The first commit modifies `data.txt` in a way that conflicts with `main`.\n- Rebase `feature-branch` onto `main`.\n- Resolve the conflict in `data.txt` by keeping both lines (the line from `main` followed by the line from `feature-branch`), so that the final file contains exactly:\n  ```\n  Line from main\n  Line from feature\n  ```\n- The `feature-branch` bookmark must point to the head of the rebased commits.\n\n## Constraints\n- Project path: `/home/user/repo`\n- Do not create any new bookmarks.\n- The final `data.txt` in the `feature-branch` must have exactly the two lines specified.", "prompt_style": "spec", "grading": "The rebase is graded as topology, not as a count. `main` must be an ancestor of `feature-branch`; `main..feature-branch` must hold exactly two commits; `feature-branch` must be the head of them; the root of that stack must have `main` as its only parent and `feature-branch` must have the stack root as its only parent, i.e. a linear chain planted directly on main. When the anchor is available it then requires that `main` is the bootstrap's 'main commit' change and that the two stack commits are the bootstrap's 'feature commit 2' and 'feature commit 1', in that order. The conflict resolution is read with `jj file show data.txt` at the anchored 'feature commit 2' and compared as a list of lines against ['Line from main', 'Line from feature'], deliberately line-wise rather than byte-wise so a missing trailing newline does not fail a correct answer. Commits are identified by anchored change id plus bookmarks and revsets — no `@` position anywhere. No English is read: conflict-freedom comes from the `conflict` boolean template keyword rather than from `jj resolve --list`'s prose. The guard is the shared anchor fixture plus an anchor_exemptions.json blessing the disappearance of the bootstrap's empty `@`, which jj auto-abandons when the agent runs `jj edit` on the conflicted commit.", "scoring": "3 tests, 1 floored (test_no_unresolved_conflicts), 2 scored. So the reward is effectively 0, 0.5 or 1.0, and 1.0 additionally requires the floored conflict test to pass. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": true, "tests_total": 3, "tests_floored": 1, "tests_scored": 2, "floored_test_names": ["test_final_state.py::test_no_unresolved_conflicts"], "weaknesses": "The identity half of the topology test is wrapped in `if all(wanted.values())`, so with no anchor file it silently drops to bookmark-and-ancestry only; and the conflict-freedom check is floored, so it earns nothing.", "prompt_terse_verbatim": "rebase feature-branch onto main, resolving the conflict in the commit that has it: both lines, main's first\n", "terse_arm": "rebase_branch_terse", "section": "shipping", "slug": "rebase_branch"}, {"name": "restore_interactive", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§3 'Where the better task has the weaker prompt': keep the verifier, rewrite the prompt — it is the most verifier-shaped prompt in the repo, enumerating the end state as seven bullets that map one-to-one onto assertions.", "prompt_verbatim": "# Recover a File Dropped by a Commit in the Middle of a Stack\n\n## Background\nIn Jujutsu (`jj`), a commit is not a sealed record: any commit in the history can be\nrewritten in place after the fact, and its descendants are carried along\nautomatically. That means a mistake buried in the middle of a stack of commits can\nbe corrected where it happened, so the history ends up in the shape it should have\nhad, rather than being patched over by a later commit that puts the mistake right.\n\n## Requirements\nThe repository at `/home/user/myproject` has four commits above the root, oldest\nfirst:\n\n1. `Initial commit` — adds `main.py`, `legacy.py` and `settings.toml`.\n2. `remove legacy module` — deletes `legacy.py` and rewrites `main.py` so it no\n   longer uses that module. It also deletes `settings.toml`, and that part was a\n   mistake: `settings.toml` is still needed.\n3. `add logging` — rewrites `main.py` again.\n4. The working copy, which has no description and adds `notes.txt`.\n\nBring the repository to this end state:\n\n- The `remove legacy module` commit must no longer delete `settings.toml`. That\n  commit must contain `settings.toml` with exactly the content it has in\n  `Initial commit`.\n- Everything else that commit does must be untouched: it must still delete\n  `legacy.py`, and its change to `main.py` must be exactly as it is now.\n- `settings.toml` must also be present, with that same content, in the\n  `add logging` commit and in the working copy — including on disk at\n  `/home/user/myproject/settings.toml`.\n- `legacy.py` must stay absent from `remove legacy module` onwards.\n- `add logging` must still record only its own change to `main.py`.\n- The only change in the working copy relative to its parent must still be the\n  addition of `notes.txt`.\n- The history must still consist of exactly those four commits, in that order. Do\n  not add, remove or reorder commits, and do not change any description.\n\n## Constraints\n- Project path: `/home/user/myproject`\n- The repository must remain a valid `jj` repository.\n", "prompt_style": "spec", "grading": "Six scored assertions, every one about a commit's tree or its own diff, compared byte-for-byte against the bootstrap's literal file contents. The commit the bootstrap described 'remove legacy module' must now contain settings.toml with the original bytes, must no longer list settings.toml among the paths it changes, and must still change exactly {legacy.py, main.py} with main.py at its original post-cleanup content; 'Initial commit' must be byte-identical to the bootstrap's; 'add logging' must still change only main.py and still carry the right settings.toml and no legacy.py; the handover working copy must change only notes.txt and carry the right trees; and settings.toml must be back on disk with the original bytes. The three named commits are identified by anchored change id and the working copy by the anchor's per-workspace key; the only positional element is a deliberately relaxed ancestry check — the handover change must be `@` or an ancestor of it — which replaced an `@ == handover` equality that had been failing correct solves that ran `jj new`. Nothing reads jj prose; `jj diff --name-only` and templated `jj log` output are parsed as data. The guard is the shared anchor fixture (no exemption file, so no bootstrap commit may disappear) plus resolving every graded commit through the anchor, which the docstring records as what killed a fabricated four-commit chain that had scored 6 of 6.", "scoring": "7 tests, 1 floored (test_history_shape), 6 scored. Partial credit is k/6, capped at 5/6 = 0.833333 whenever anything fails — the finest-grained reward in the suite. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 7, "tests_floored": 1, "tests_scored": 6, "floored_test_names": ["test_final_state.py::test_history_shape"], "weaknesses": null, "prompt_terse_verbatim": "the commit that removed the legacy module also deleted a config file we need — restore it there, not on top\n", "terse_arm": "restore_interactive_terse", "section": "shipping", "slug": "restore_interactive"}, {"name": "split_commit_interactive", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": null, "prompt_verbatim": "# Split a Commit in Jujutsu\n\n## Background\nYou are working on a project using `jj` (Jujutsu). You have a single commit that introduces two features at once, but you realize they should be separated into two distinct commits for a cleaner history.\n\n## Requirements\n- The repository is located at `/home/user/myproject`.\n- The parent of the current working copy (`@-`) contains two files: `feature_a.py` and `feature_b.py`, and has the description \"Add feature A and feature B\".\n- You must split this commit into two separate commits.\n- The first commit (older) must contain ONLY `feature_a.py` and have the description exactly \"Add feature A\".\n- The second commit (newer, child of the first) must contain ONLY `feature_b.py` and have the description exactly \"Add feature B\".\n- The current working copy (`@`) should remain empty and be a child of the \"Add feature B\" commit.\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Use only `jj` commands.", "prompt_style": "spec", "grading": "The two halves are located from the bootstrap's own commit rather than by position. The anchored change id of 'Add feature A and feature B' is resolved; if that change still has a non-root parent the split gave the id to the newer half and the older half is that parent, otherwise the anchored commit is the older half and the newer half is its single child. Each half must resolve to exactly one commit, and the anchored commit must be one of the two. The older half's description must equal 'Add feature A' exactly and its `jj diff -s` output must mention feature_a.py and not feature_b.py; the newer half is the mirror image. Both scored tests re-run that resolution, so a fabrication cannot collect half the reward. Nothing is identified by position — the old `@`-position test was deleted after it scored a textbook `jj edit` + `jj split -i` solve 0.5 — and nothing reads jj's English; the only substring matching is on filenames in `jj diff -s` output. The guard is the shared anchor fixture plus an anchor_exemptions.json blessing the empty `@` that jj auto-abandons on the interactive route.", "scoring": "2 tests, 0 floored, 2 scored. The reward is 0, 0.5 or 1.0 — one grader artifact halves the task. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": true, "tests_total": 2, "tests_floored": 0, "tests_scored": 2, "floored_test_names": [], "weaknesses": "Only which filenames each half touches is graded, never file contents, and `jj diff -s` is substring-matched — so a split that moves the right paths with the wrong bytes inside them still passes.", "prompt_terse_verbatim": "split the last commit in two, \"Add feature A\" then \"Add feature B\"\n", "terse_arm": "split_commit_interactive_terse", "section": "shipping", "slug": "split_commit_interactive"}, {"name": "squash_range", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§1 R1 corollary: the prompt leaks the technique — it opens 'Revsets let one operation name a whole range of source commits rather than one at a time' — and enumerates the post-state commit count. Rewrite the prompt; the verifier is sound.", "prompt_verbatim": "# Squash a Range of Commits\n\n## Background\nIn Jujutsu (`jj`), the changes recorded in several commits can be combined into a single commit, after which the source commits no longer appear in the log. Revsets let one operation name a whole range of source commits rather than one at a time.\n\n## Requirements\n- You have a `jj` repository at `/home/user/myproject`.\n- It contains a commit with the description `feat: initial structure`.\n- It has two child commits with descriptions `fix: syntax error` and `fix: logic error`.\n- There is a descendant commit `feat: add more stuff`.\n- Combine the two `fix` commits into the `feat: initial structure` commit. Afterwards exactly four commits must remain in the log (the root commit, `initial commit`, `feat: initial structure`, and `feat: add more stuff`), and `feat: initial structure` must carry both fixes.\n\n## Constraints\n- Project path: `/home/user/myproject`", "prompt_style": "spec", "grading": "Five scored assertions plus an anti-fabrication replay. The bootstrap's 'initial commit', 'feat: initial structure' and 'feat: add more stuff' changes must still be visible, and any other visible commit must render `empty == true` — a scratch commit is free, a commit still carrying content is not. The two fix changes must be gone, checked by anchored change id rather than by searching the log for their text (squashing folds their descriptions into the target, so a text search would flag a correct solve). The target's structure.txt must be exactly 'logic fixed\\n', and parents are compared as change ids: target on origin, descendant on target. The anti-fabrication guard is an `--at-op` replay: the last operation transition at which the fix change ids stopped being visible must also be the one at which the target's structure.txt became the final content, which fails hand-edit-then-`jj abandon` and cannot fail any honest route however many operations it took. Nothing is positional and nothing reads jj's operation descriptions or any other English — the previous suite lost a task's signal when jj renamed 'undo' to 'revert'. On top of that sits the shared anchor fixture, with an anchor_exemptions.json naming the two fix commits.", "scoring": "8 tests, 3 floored (target survived, target still described as the target, `feature` bookmark on the target or an ancestor), 5 scored. Partial credit is k/5, capped at 4/5 = 0.8 whenever anything fails. A no-agent run scores 0. Note the doc's own finding: the op-count test that made this the sharpest separator in the 795-trial baseline was deleted on this branch, so the two-sequential-squash route is now believed to score 1.0.", "anchored": true, "anchor_exemptions": true, "tests_total": 8, "tests_floored": 3, "tests_scored": 5, "floored_test_names": ["test_final_state.py::test_feature_bookmark_still_points_at_the_target", "test_final_state.py::test_target_commit_still_described_as_the_target", "test_final_state.py::test_target_commit_survived"], "weaknesses": "The op-log replay authenticates the history against itself — a repository rebuilt and then squashed properly agrees with its own record — so it is only the anchor that makes it an integrity check.", "prompt_terse_verbatim": "merge the two fix commits into their parent (leave the current commit alone)\n", "terse_arm": "squash_range_terse", "section": "shipping", "slug": "squash_range"}, {"name": "template_customize_log_output", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§1 R1 corollary: the prompt hands over the template expression (`change_id.short()`, `description.first_line()`, `\"\\n\"`) verbatim, so it tests reading comprehension. §4.0.2 #10 adds a verifier repair for jj 0.44: a template runtime error renders `\u003cError: …>` inline at exit 0, so any graded artifact containing that substring must be rejected before comparison.", "prompt_verbatim": "# Customize jj log output with Templates\n\n## Background\nJujutsu (`jj`) supports a powerful functional templating language to customize the output of commands like `jj log`. You can define template aliases in your config to reuse custom formats.\n\n## Requirements\nYou have a jj repository initialized at `/home/user/repo`.\nYour task is to configure a new template alias named `log_custom` for the `jj` CLI.\nThe alias must output the short change ID (`change_id.short()`), followed by `\" | \"`, followed by the first line of the commit description (`description.first_line()`), and ending with a newline (`\"\\n\"`).\n\n## Constraints\n- Project path: `/home/user/repo`\n- The alias must be named exactly `log_custom`.", "prompt_style": "spec", "grading": "Two assertions, and neither grades a commit. First, `jj config get template-aliases.log_custom` must exit 0, and its value — after a real newline is normalised back to the two characters `\\n`, so TOML-escaped and hand-written forms compare equal — must contain `change_id.short()`, `description.first_line()`, a quoted ' | ' separator and a quoted newline. Second, and this is the real assertion, `jj log -r all() --no-graph -T log_custom` must render byte-identically to the verifier rendering the reference template over the same revisions, so the check is indifferent to quoting, to which config layer the alias lives in and to whether it was written by `jj config set` or by hand. No commit is identified at all — not by anchored change id, not by position, not by description — because the task is about a config value and its rendering; the task carries no anchored claim of its own. The first test is a set of literal substring checks over the config value (jj's data, not its prose); the second compares rendered bytes on both sides. The only fabrication guard is the shared session-scoped anchor fixture, which still requires every bootstrap change id and the handover operation id to be present.", "scoring": "2 tests, 0 floored, 2 scored. The reward is 0, 0.5 or 1.0. A no-agent run scores 0. The doc records this as the second-sharpest discriminator in the baseline at 9/15, and separately as one of three measured grader artifacts — identical correct behaviour scored 1.0 hand-edited and 0.5 through `jj config set`, which is what the current tolerant normalisation was written to fix.", "anchored": false, "anchor_exemptions": false, "tests_total": 2, "tests_floored": 0, "tests_scored": 2, "floored_test_names": [], "weaknesses": "Nothing anchors the graded object, and on jj 0.44 a template runtime error renders `\u003cError: …>` inline at exit 0 — both sides of the byte comparison would render it identically, so the render test can pass on garbage until an explicit `\u003cError:` rejection is added.", "section": "shipping", "slug": "template_customize_log_output"}, {"name": "track_untracked_file", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": null, "prompt_verbatim": "# Track an Ignored File in Jujutsu (jj)\n\n## Background\nIn `jj` (Jujutsu), new files are automatically tracked and included in the working copy commit. However, files that match patterns in `.gitignore` are ignored and not automatically tracked. Sometimes, you may need to explicitly track a specific file that is otherwise ignored, without modifying the `.gitignore` rules.\n\n## Requirements\n- Explicitly track the ignored file `app.log` in the repository.\n- Do not modify the existing `.gitignore` file.\n- Finalize the current working copy by creating a new commit with the message \"Track log file\".\n\n## Constraints\n- Project path: `/home/user/project`", "prompt_style": "spec", "grading": "Everything is asserted about one commit: the change the bootstrap's working copy was sitting on, resolved through the anchor's reserved per-workspace key because its handover description was empty. That change must track app.log in `jj file list`, and its description must contain 'Track log file'. The floored third test byte-compares .gitignore against the bootstrap's exact '*.log\\n' both on disk and in that commit's tree. Nothing is positional — the previous version graded `@-`, which scored a correct `jj describe` finish 0 and a fabricated commit at `@-` a full 1.0 — and nothing reads jj's English. The guard is the shared anchor fixture with deliberately no exemption file, so a route that abandons the handover working copy instead of finalising it fails outright, and a wipe-and-rebuild fails on the handover operation id.", "scoring": "3 tests, 1 floored (test_gitignore_unchanged), 2 scored. The reward is 0, 0.5 or 1.0, and the full mark additionally requires the floored .gitignore check to pass. A no-agent run scores 0. This is the one kept task with a measured non-zero failure rate on sonnet.", "anchored": true, "anchor_exemptions": false, "tests_total": 3, "tests_floored": 1, "tests_scored": 2, "floored_test_names": ["test_final_state.py::test_gitignore_unchanged"], "weaknesses": "The byte-exact .gitignore check that catches the `!app.log` cheat is floored, so that cheat still passes both scored tests and is only capped below 1.0 rather than zeroed.", "prompt_terse_verbatim": "app.log is ignored but I need it tracked, commit as \"Track log file\", don't touch the ignore rules\n", "terse_arm": "track_untracked_file_terse", "section": "shipping", "slug": "track_untracked_file"}, {"name": "workspace_update_stale", "status": "built", "keep_tier": "shipping_14", "provisional": false, "separated_models": true, "repair_needed": "§2/§5.1 (corrected): delete the redundant stderr grep at tests/test_final_state.py:89 as hygiene — the exit-code assertion on the line above already discriminates — and relax the `@-` positional. The doc explicitly withdraws the claim that this task grades English and restores it to a full keep.", "prompt_verbatim": "# Update Stale Workspace\n\n## Background\nYou are working in a `jj` repository at `/home/user/myproject`. Another user (or process) recently modified the repository from another workspace (`/home/user/workspace_b`), which caused your current workspace's working copy to become stale. A stale working copy means the commit your workspace is sitting on was changed by an operation run elsewhere, so your working copy files no longer match it.\n\n## Requirements\n1. Update the stale working copy in `/home/user/myproject` so that it is no longer stale.\n2. After updating, you will see that `config.json` has been modified by the other workspace (the `status` field is now `\"pending\"` and `new` is `true`).\n3. Modify `config.json` by changing the `\"status\"` field from `\"pending\"` to `\"active\"`.\n4. Commit the change with the exact description `\"Activate config\"`.\n\n## Constraints\n- Project path: `/home/user/myproject`", "prompt_style": "spec", "grading": "Three assertions, all of which additionally require the commit they inspect to be — or to descend from — the change this workspace's working copy was sitting on at handover, which is where the other workspace's work landed; that change is resolved through the anchor's per-workspace key. First, `jj st` must exit 0 in the project (a stale working copy exits 1 on the pinned jj) and its stderr must not contain 'stale'. Second, config.json on disk must parse as JSON with status == 'active' and new == true, and the committed copy at `@-` must say the same, so the other workspace's field was preserved rather than overwritten. Third, the commit at `@-` must have a description containing 'Activate config'. So identity is anchored but the graded commit itself is addressed positionally as `@-`. One assertion does read jj's English — the stderr substring 'stale' — though it sits behind the exit-code check and can only produce a false negative; 'Activate config' is a substring check on a `-T description` render of agent-authored text the instruction mandates. The guard is the shared anchor fixture plus the descends-from-the-handover claim, which the docstring records as what killed a measured fabricate-from-`root()` solve that had scored 1.0.", "scoring": "3 tests, 0 floored, 3 scored. Partial credit is 0, 0.333333 or 0.666667, capped at 0.666667 whenever anything fails. Measured in a real container on the pinned image: the untouched image scores 0 (all three scored tests fail) and a genuine `update-stale` → edit → `jj commit` solve scores 1.", "anchored": true, "anchor_exemptions": false, "tests_total": 3, "tests_floored": 0, "tests_scored": 3, "floored_test_names": [], "weaknesses": "The graded commit is `@-` by position, so a correct solve that finishes by describing the updated working copy in place (leaving it at `@`) fails two of the three scored tests.", "section": "shipping", "slug": "workspace_update_stale"}, {"name": "absorb_changes", "status": "built", "keep_tier": "shipping_14", "provisional": true, "separated_models": false, "repair_needed": "§5.1 amendment 3: held for capability coverage alone, so it contributes nothing to a paired comparison. It leaves when survey theme 3.3 (absorb review feedback) lands and screens well.", "prompt_verbatim": "# Absorb Changes into Appropriate Commits\n\n## Background\nYou are working on a project tracked with `jj` (Jujutsu) at `/home/user/project`. \nYou have been developing two distinct features in a stack of commits:\n1. A commit that modifies `feature_a.py`.\n2. A child commit that modifies `feature_b.py`.\n\nWhile testing the latest state, you found bugs in both features and fixed them directly in your current working copy (`@`). Instead of manually splitting these changes and squashing them into their respective commits, you want to use a single `jj` command to automatically distribute these bug fixes to the appropriate mutable ancestors where the lines were last modified.\n\n## Requirements\n- Distribute the changes in your working copy to the nearest mutable ancestors using the appropriate `jj` command.\n- After the operation, the working copy (`@`) should be empty (no changes).\n\n## Constraints\n- Project path: `/home/user/project`", "prompt_style": "spec", "grading": "The task is graded as per-file placement, which is what distinguishes absorb from a wholesale squash. For feature_a.py: the commit the bootstrap described 'Initial commit', resolved by anchored change id, must touch feature_a.py in its own diff (`jj diff --name-only`), its content there must carry the marker 'Feature A fixed', and `{target}..@ & files(root-file:\"feature_a.py\")` must be empty — no later commit may still be modifying that path. feature_b.py is the same test against the anchored 'Add feature A' commit. The third test requires `@` to be, or descend from, the anchored 'Add feature A' commit, to render `empty == true` and to have no changed paths. Commits are identified by anchored change id, with the working copy anchored by relation rather than identity; nothing is positional. No English is read — emptiness comes from the template keyword rather than from jj's 'The working copy has no changes.' The guard is the shared anchor fixture plus an anchor_exemptions.json permitting the handover `@` to disappear, since the per-file `jj squash --into` route empties it and jj abandons an emptied squash source.", "scoring": "3 tests, 0 floored, 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all three. A no-agent run scores 0 — and note the docstring's record that the old version of test_feature_b_absorbed passed on the untouched image because it read the file at the very commit holding the un-absorbed fix.", "anchored": true, "anchor_exemptions": true, "tests_total": 3, "tests_floored": 0, "tests_scored": 3, "floored_test_names": [], "weaknesses": "The content check is a substring of the fix marker, so hand-placing the right line into the right ancestor passes without `jj absorb` ever running — correct under R3, but it means the task cannot distinguish absorb from a careful manual squash.", "section": "shipping", "slug": "absorb_changes"}, {"name": "undo_mistaken_rebase", "status": "built", "keep_tier": "shipping_14", "provisional": true, "separated_models": false, "repair_needed": "§5.1 amendment 3: capability-coverage keep only; survey theme 3.6 (recover from your own mistake) is its deeper replacement.", "prompt_verbatim": "# Undo a Mistaken Rebase in jj\n\n## Background\nJujutsu (`jj`) records every repository operation in an operation log, so any change to the\nrepository can be reverted after the fact — including a rebase that has already completed.\n\nThe repository at `/home/user/repo` has the linear history `base` -> `A` -> `B`, with the\nbookmark `main` on `A`.\n\n## Requirements\n1. Rebase commit `B` onto `base`. This is the mistake you are going to revert.\n2. Undo that rebase, returning the repository to the state it was in beforehand.\n\n## Constraints\n- Project path: `/home/user/repo`\n- Both steps must actually be performed: the operation log must show the rebase, and then the\n  undo that reverted it.\n- Afterwards the history must be exactly `base` -> `A` -> `B` again, with `main` on `A` and the\n  file `f` holding `base`, `A`, and `B` in those respective commits.\n", "prompt_style": "spec", "grading": "The whole operation log is replayed with `jj --at-op`, and at each operation the verifier asks where the bootstrap's `B` change was sitting, as change ids. The first scored test requires that at some recorded operation `B`'s only parent was the bootstrap's `base` change — the mistaken rebase happened, and happened to that commit. The second requires that plus, at the current operation, `B` sitting on the bootstrap's `A` with the `conflict` template keyword false. It is a conjunction on purpose: this task's correct end state IS its bootstrap state, so every pure end-state assertion here is in the vacuity floor and earns nothing. All three commits are identified by anchored change id, wrapped as `present(change_id(\u003cid>))` so an operation predating a commit does not error; the floored tests still resolve by `description(substring:…)` and one compares parents by description first line. Nothing matches jj's English operation descriptions — the previous version did, and the docstring records three measured mis-scores from it, including reward 1.0 for a throwaway rebase that never touched `B` and reward 0.5 for a repository that was never fixed. The guard is the shared anchor fixture, which is what makes the replay an integrity check rather than a self-consistency one.", "scoring": "6 tests, 4 floored (commits survived, topology restored, main bookmark restored, file contents restored — all of which pass on the untouched bootstrap by design), 2 scored. The reward is 0, 0.5 or 1.0. A no-agent run scores 0/2. The docstring records the measured spread: rebase + any of undo / op undo / op revert / op restore all score 2/2; the unrelated-rebase cheat 0/2; rebase-without-undo and the snapshot-undo 1/2.", "anchored": true, "anchor_exemptions": false, "tests_total": 6, "tests_floored": 4, "tests_scored": 2, "floored_test_names": ["test_final_state.py::test_commits_survived", "test_final_state.py::test_file_contents_restored", "test_final_state.py::test_main_bookmark_restored", "test_final_state.py::test_topology_restored"], "weaknesses": "Only 2 scored tests, so a single grader artifact halves the task; and the replay cannot tell a deliberately staged rebase-and-revert from a genuine mistake — only the anchor rules that out.", "section": "shipping", "slug": "undo_mistaken_rebase"}, {"name": "operation_recovery", "status": "built", "keep_tier": "shipping_14", "provisional": true, "separated_models": false, "repair_needed": "§5.1 amendment 3: capability-coverage keep only; survey theme 3.6 is its deeper replacement.", "prompt_verbatim": "# Return a Repository to an Earlier State\n\n## Background\nJujutsu (`jj`) keeps a record of every step it has taken in a repository — each commit, each rebase, each snapshot of the working copy. That record holds the complete repository state as it was after each step, so a repository can be put back the way it was at an earlier point, and the states in between are never thrown away.\n\n## Requirements\nThe repository at `/home/user/project` holds five commits, described `Commit 1` through `Commit 5`, each adding one file, with an empty working-copy commit on top. The last three commits were a mistake. Put the repository back exactly as it was immediately after `Commit 2` was created — the point at which `Commit 2` existed and the working copy was the new empty commit sitting on top of it. The end state must satisfy all of the following:\n\n1. `/home/user/project` holds `file1.txt` (containing `C1`) and `file2.txt` (containing `C2`); `file3.txt`, `file4.txt` and `file5.txt` are gone from it. Those two files are the whole content of the working copy — nothing else is recorded in it.\n2. Exactly four commits are visible: the root commit, `Commit 1`, `Commit 2`, and the empty working-copy commit on top of `Commit 2`. Nothing described `Commit 3`, `Commit 4` or `Commit 5` is visible any more.\n3. `Commit 1` and `Commit 2` are still the same two commits they are now — same commit IDs, same parents. Do not rewrite them or rebuild equivalents of them.\n4. The working copy is the same empty, undescribed commit that was the working copy immediately after `Commit 2` was created: the same change ID, with `Commit 2` as its parent. Creating a fresh empty commit on top of `Commit 2` produces a different commit and does not satisfy this.\n5. Nothing is erased. The discarded work must still be reachable through the repository's record of past steps, so do not delete, re-initialise, or prune anything.\n\n## Constraints\n- Project path: `/home/user/project`.", "prompt_style": "spec", "grading": "The recovered state is asserted commit by commit. file3/4/5.txt must be off disk and absent from the tree of the anchored change the bootstrap went on to describe 'Commit 3'; that change must track exactly file1.txt and file2.txt; no commit may be described 'Commit 3', 'Commit 4' or 'Commit 5', and the anchored 'Commit 4' and 'Commit 5' changes must not resolve at all. Then `@` must BE that anchored 'Commit 3' change, must render `empty`, must be undescribed, and its parent must be the anchored 'Commit 2' — which is what separates going back to the earlier state from editing history forward into a similar shape. Finally exactly four commits may be visible and the three anchored changes must be among them. Commits are identified by anchored change id throughout (falling back to values read at the operation that first created 'Commit 2'); `@` is used, but pinned by equality to an anchored change rather than by offset. No English is read — descriptions are matched with explicit `description(exact:…)`/`substring` pattern kinds. The guard is the shared anchor fixture plus an anchor_exemptions.json naming Commit 4, Commit 5 and the handover `@`; 'Commit 3''s change is deliberately not exempted, because requirement 4 asks for it back.", "scoring": "8 tests, 3 floored (kept files' contents on disk, kept commits' commit ids against the reference operation, and 'some operation still records Commit 5'), 5 scored. Partial credit is k/5, capped at 0.8 whenever anything fails. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": true, "tests_total": 8, "tests_floored": 3, "tests_scored": 5, "floored_test_names": ["test_final_state.py::test_earlier_operations_are_still_recorded", "test_final_state.py::test_kept_commits_are_the_original_commits", "test_final_state.py::test_kept_files_present_with_original_contents"], "weaknesses": "`@` must be exactly the recovered change, so a correct recovery that ends standing somewhere else loses a fifth of the reward; and the commit-id equality check that would catch a rebuild-then-`op restore` is floored, so it earns nothing.", "section": "shipping", "slug": "operation_recovery"}, {"name": "git_fetch_remote", "status": "built", "keep_tier": "shipping_14", "provisional": true, "separated_models": false, "repair_needed": "§5.1 amendment 3: capability-coverage keep only; survey themes 4.1 and 4.4 (fetch and reconcile) are its replacements. §3 also folds `bookmark_push` into it.", "prompt_verbatim": "# Fetch and Rebase with jj\n\n## Background\n`jj` (Jujutsu) allows you to seamlessly interact with Git remotes. In this task, you need to fetch new changes from a remote repository, rebase your local work onto the updated main branch, and push your changes back.\n\n## Requirements\n- Fetch the latest changes from the `origin` remote.\n- Rebase the `feature` bookmark onto the updated `main` branch, which exists in this repo only as the remote bookmark `main@origin`.\n- Push the `feature` bookmark to the `origin` remote.\n\n## Constraints\n- Project path: `/home/user/repo`", "prompt_style": "spec", "grading": "Both assertions are made in the bare remote at /home/user/remote.git with git plumbing, against a commit id computed from the working repository at verification time. The bootstrap's 'Feature commit' change is resolved by anchored change id, and the commit id it resolves to *now* is read from jj — because the rebase the task asks for preserves the change id and rewrites the commit id, so the expected value cannot be stored anywhere. `git rev-parse refs/heads/feature` in the remote must equal that commit id. The second test repeats that and adds: the remote must have a `main`, `feature` must not be the same commit as `main`, and `git merge-base --is-ancestor main feature` must succeed. Commits are identified by anchored change id resolved to a live commit id — never by position and never by description on the remote side. One assertion reads text ('feature' in `git branch --list` stdout), but the decisive comparison beside it is the rev-parse equality. The guard is the shared anchor fixture plus that equality, which kills both the measured `git branch feature main` cheat (reward 1.0 without running jj at all) and an additive fabrication; the explicit `pushed != main` assertion closes the trivially-true `merge-base` case.", "scoring": "2 tests, 0 floored, 2 scored. The reward is 0, 0.5 or 1.0. A no-agent run scores 0. This is the longest chain in the current suite at three dependent steps.", "anchored": true, "anchor_exemptions": false, "tests_total": 2, "tests_floored": 0, "tests_scored": 2, "floored_test_names": [], "weaknesses": "The two scored tests overlap heavily — both assert `pushed == wanted` — so the reward is close to pass/fail, and nothing asserts that a fetch happened at all.", "section": "shipping", "slug": "git_fetch_remote"}, {"name": "workspace_add", "status": "built", "keep_tier": "shipping_14", "provisional": true, "separated_models": false, "repair_needed": "§5.1 amendment 3: capability-coverage keep only — and the one of the five with no replacement, because the survey's 51-theme menu contains no workspace theme at all. §3 also folds `workspace_forget` into it as an add → list → forget lifecycle.", "prompt_verbatim": "# Add a new jj workspace\n\n## Background\nYou have a Jujutsu repository initialized at `/home/user/myproject`. You want to work on a different feature simultaneously without disturbing your current working copy. You can do this by adding a new workspace.\n\n## Requirements\n- Create a new workspace for the repository at `/home/user/myproject-workspace2`.\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Workspace path: `/home/user/myproject-workspace2`", "prompt_style": "spec", "grading": "The load-bearing claim, re-run in all three tests, is that the new directory is backed by the project's repository: the change id the anchor recorded for the project's handover working copy must resolve from inside /home/user/myproject-workspace2, which a separately-created repository cannot do whatever it is named. Around that: the directory exists, `jj workspace root` there exits 0 and prints that path, it has a .jj, `jj workspace list` in the project reports at least two workspaces with the anchored working copy among their targets, the new directory's own `@` is one of those listed targets, and a plain `jj status` (deliberately without --ignore-working-copy) succeeds there. Commits are identified by the anchor's per-workspace key, not by position or description. Two reads are textual but not English: `jj workspace root`'s stdout is compared against a literal path, and `jj workspace list` is parsed through an explicit `-T` template. The guard is the shared anchor fixture plus the resolve-from-inside check, which the docstring records as what closes the measured `jj git init /home/user/myproject-workspace2` cheat that had scored 1.0.", "scoring": "3 tests, 0 floored, 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all three. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 3, "tests_floored": 0, "tests_scored": 3, "floored_test_names": [], "weaknesses": "With no anchor file the identity claim degrades to 'the project's current `@` resolves inside the workspace', and one assertion compares `jj workspace root` stdout against a hardcoded path literal.", "section": "shipping", "slug": "workspace_add"}, {"name": "N1 — a conflict that propagates instead of being resolved on the spot", "status": "proposed", "capability": "First-class conflicts as a state you carry rather than a stop-the-world event: resolve once at the commit where the conflict was introduced and let jj propagate the resolution through every descendant. The current suite has four conflict tasks and they are all the same shape — one file, two sides, textual, resolved on the spot — so nothing reaches jj's actual differentiator, that a conflicted commit is a normal commit you can build on.", "prompt_proposed": "I rebased onto main and the middle commit blew up. Don't unpick the stack — fix it where it broke and make sure everything above comes out clean.", "prompt_is_drafted_by_me": false, "fixture": "A four-commit stack that conflicts in its second commit when rebased onto a moved `main`, with a fifth commit already sitting on top of the conflict. The survey's executed version of the same ground (theme 3.5) is a three-commit feature stack rebased onto a divergent trunk, which left four commits `conflict=true` — the three stack commits plus `@` itself. The prompt must pin the intended resolution ('everything above comes out clean' / 'keeping both sides' behaviour') and the fixture must make exactly one file content satisfy it, because conflict resolution is not auto-gradeable unless the intent is pinned.", "grading": "The verifier asserts that the anchored middle change has `conflict == false`, that every anchored descendant also has `conflict == false` and still carries its own changes, and that the head's tree contains the resolved file with the pinned content. Graded commits are identified by anchored change id from `bootstrap_anchor.json` (never by `@` position and never by description), so the same assertions hold whichever route the agent took. Per the survey's executed run of this fixture the assertion must be `conflicts()` is empty across the whole repo rather than 'the three stack commits are clean', because `@` is conflicted too. The plausible-wrong-solve guard is structural rather than incidental: a fixup commit stacked on top leaves the anchored middle change conflicted and fails, which is the R4 test this task exists for. The fabrication guard is that every graded commit resolves through its anchored change id, so rebuilding an equivalent clean stack from `root()` and moving bookmarks onto it fails — the proposal records reward 1.0 for exactly that rebuild route on two existing tasks that skipped the anchor. Nothing here may grade jj's advice block, which changes wording between versions.", "grading_is_inferred": false, "discriminates": "The git-shaped model in which a conflict halts work and must be cleared before anything else can happen — so the agent either unpicks the stack commit by commit or lands a fixup on top, leaving the commit that actually broke still conflicted. The correct model is that the rebase succeeded at exit 0, the conflict lives in the commit, and one resolution at the source clears the whole subtree.", "risks": "The proposal folds N1 into the survey's themes 3.5 and 2.4 and says N1 conflates them — 'resolve the propagated conflict once' (Tier 3) and 'leave a conflict and build on it' (Tier 2) are better as two tasks, and the survey's warranted fixture recipe wins where they overlap. Conflict resolution is ungradeable unless the fixture admits exactly one satisfying content. `jj resolve --tool :ours`/`:theirs` map to destination/rebased-revision respectively, so the fixture must not let a `:ours` shortcut be accidentally correct.", "needs_verification": null, "section": "proposed", "slug": "n1", "struck": false, "code": "N1", "headline": "a conflict that propagates instead of being resolved on the spot"}, {"name": "N2 — a merge commit the agent creates", "status": "proposed", "capability": "Creating an n-parent merge and resolving the clash inside it. Hole A in the proposal: zero tasks create a merge, there is no `jj new A B` anywhere and no assertion anywhere on `parents.len() > 1`; `resolve_tool`'s bootstrap contains a merge the agent only resolves, never one it builds.", "prompt_proposed": "Merge feature-a and feature-b and sort out the clash in config.toml — keep both settings.", "prompt_is_drafted_by_me": false, "fixture": "Two bookmarks whose tips both changed `config.toml`, with no merge present in the repo. Both tips must be anchored so the verifier can require they were not rewritten, and the two edits must be arranged so that 'keep both settings' has exactly one satisfying file content.", "grading": "The verifier asserts `@`'s parents are exactly the two anchored changes, order-insensitive, using `parents.len()` and `parents.map(|p| p.change_id())` (the grading instrument the proposal takes from survey theme 1.5, which is recorded as verified working); that the merge has `conflict == false`; that the merged `config.toml` contains both settings; and that neither anchored parent change was rewritten — same change ids and same commit ids as the bootstrap recorded. Graded commits resolve through anchored change ids, and the two parents' surviving commit ids are themselves the fabrication guard: a solve that rebuilds either side, or that fakes a merge by hand-writing a combined `config.toml` into a single-parent commit, fails on `parents.len()` and on the parent commit-id check together. Note the proposal says merge with *ordered* parents is theme 1.5's shape while N2's is order-insensitive; the hybrid N2 keeps is 'a merge the agent creates AND resolves', which the survey menu lacks. Nothing about jj's merge output text is graded.", "grading_is_inferred": false, "discriminates": "Looking for a `jj merge` subcommand (it does not exist) and the assumption that a merge is an exotic operation, versus knowing `jj new A B` is the ordinary way to build one. The wrong-but-plausible solve is a single-parent commit that just contains the union of both files' contents, which passes a content check and fails `parents.len()`.", "risks": "The proposal notes theme 1.5 'saturates fast once a model knows `jj new A B C`' and should be floor-only in its Tier 1 form; N2 earns its slot only because the agent must also resolve the clash inside the merge it made. It is also a two-to-three step task, and amendment 2 wants at least six of the ten to compose five or more dependent operations — N2 is not one of those six.", "needs_verification": "The proposal marks 'jj merge does not exist' as [0.38-only — re-check] in its provenance roster (§4.0.3): the probe is `jj merge -h` on `jj 0.44.0-af45d57de716`, and both N2 and theme 1.5 assume `jj new A B` is the only route.", "section": "proposed", "slug": "n2", "struck": false, "code": "N2", "headline": "a merge commit the agent creates"}, {"name": "N3 — evolog as recovery", "status": "proposed", "capability": "Using the evolution log to recover a clobbered version of a change — the point of `jj evolog`, as opposed to reading it. `obslog_view` only prints the evolog and grades that it printed; nothing in the suite tests recovery, and the wider op-log recovery surface (`op revert` out of the middle of the log) is untouched.", "prompt_proposed": "I described over the wrong commit and then restored a file I shouldn't have. The old version is still in there — put that content back on the same change.", "prompt_is_drafted_by_me": false, "fixture": "A change whose current version was clobbered by the bootstrap — description overwritten and a file restored away — with the good version still reachable in that change's evolog. The proposal directs that where survey theme 3.6 ('recover from your own mistake') covers the same ground it wins, and that fixture instead ships a mistake already made (a wrong squash) plus two commits of subsequent work, so the agent must go back without discarding the later work.", "grading": "The verifier asserts the anchored change id still resolves; that its tree equals the tree of a commit id that appears in its own evolog and is not the evolog head; and that the recovered file's content matches that predecessor byte for byte — all recomputed at verification time, so no tree hash or commit id is hardcoded. Under the theme 3.6 shape the assertion relocates: grade 'does the later work still exist' plus the change-id set and descriptions, with an `--at-op` replay confirming the recovered commits are the originals rather than reconstructions. The fabrication guard is exactly that replay plus the anchored change ids — end state alone cannot distinguish 'restored' from 'rebuilt identically', which is why change-id preservation is the load-bearing assertion. No string matching anywhere: `undo_mistaken_rebase` lost 100% of its scored signal to an operation-description rename, and 0.44 added a new leading stdout line to `undo`/`revert`/`restore` that would have done it again. Divergence must be addressed through `change_id(X)` — never a bare change-id revset (it errors on a divergent change) and never the literal offsets `X/0`/`X/1`.", "grading_is_inferred": false, "discriminates": "Reaching for `jj undo` or `jj op restore \u003cpre-mistake op>`, both of which also discard the later work — `op restore` is time travel, not an inverse patch. The proposal records this as the single most expensive design error it caught: an earlier draft named `op restore` as the correct route, and on a measured `A→B→C→D` stack it left only `A,B`. Only `jj op revert \u003cthe squash operation>` reaches the stated end state, and the tempting contrast 'restore removes C and D, revert removes only C' is itself wrong — a verifier written on it fails the correct solve.", "risks": "The highest grader-artifact risk in its tier. The correct route leaves a residual divergent change (measured at offsets X/0 and X/4, not /0 and /1), so the design must decide deliberately whether residual divergence is acceptable end state and say so in the prompt if it is not. The solve is `jj op revert` and op-recovery is on the list of operations that legitimately drop a change id, so this task probably needs an `anchor_exemptions.json` — and a green pre-sweep pass cannot tell you it is missing, because the untouched image never does the work that breaks the assertion.", "needs_verification": "Two items, both in the proposal's provenance roster. (1) That `jj evolog` on the surviving side of a divergence does not carry the divergent sibling (it is a sibling, not a predecessor) is [0.38-only — re-check]; N3's verifier reads the evolog for a predecessor tree, so if that changed, 'not the evolog head' stops meaning what it means here — re-run an evolog on either side of a 0.44 divergence before authoring. (2) Theme 3.6's full fixture — squash, two commits of later work, `jj op revert` — was executed on 0.38 only; the restore-vs-revert mechanism was re-run on 0.44 but the residual divergence and its offsets were not. The proposal calls this the cheapest remaining warrant gap on the menu.", "section": "proposed", "slug": "n3", "struck": false, "code": "N3", "headline": "evolog as recovery"}, {"name": "N4 — revsets the agent writes", "status": "proposed", "capability": "Composing a non-trivial revset as the agent's own work. Hole B: one revset task exists (`revset_querying_bob`, 43 lines, substring-graded, the weakest verifier in the set), and `roots()`, `heads()`, the `..`/`::` distinction, `mutable()`/`immutable()`, `latest(n)`, `divergent()` and `at_operation()` are untested; `glob:` appears nowhere in any prompt or verifier.", "prompt_proposed": "Give me the change ids of every tip that isn't merged into main yet — one per line in unmerged.txt.", "prompt_is_drafted_by_me": false, "fixture": "A branching history with several heads, some already merged into `main`. It must be big enough that eyeballing the log is not a viable route — hole G records that every current bootstrap is at most six commits and three files, never large enough to make a revset the only practical answer.", "grading": "The verifier evaluates the reference revset in the repo at verification time and requires `unmerged.txt` to equal that set of change ids exactly — set comparison, with the expected answer never appearing as a constant in the verifier. Every jj read in the verifier must pass `--ignore-working-copy` (or go through `--at-op`, which implies it) so the verifier does not snapshot and mutate the repo it is grading. A hand-listed file passes only if it is right, which is the deliberate R3 concession: the revset is the cheap route, not the graded one. The fabrication guard is that the answer is recomputed from the repository the agent was handed, so a guessed or copied list cannot match, and the anchored change ids let the verifier additionally assert the history was not restructured to make a wrong answer true.", "grading_is_inferred": false, "discriminates": "Eyeballing `jj log` and hand-transcribing what looks like a tip — which produces a plausible, nearly-right list — versus composing `heads()`/`::`-style ancestry into a query. It also catches the git-shaped `..` reading: in jj revsets `..` and `::` differ, and an agent that carries git's range semantics over produces a confidently wrong set.", "risks": "The proposal prefers survey theme 3.7 ('messy history → mergeable') over N4 as written, because 3.7 makes the revset the *route* to an action rather than the deliverable and so dodges the zero-tool-call confound — an answer-file task invites guessing, and some fraction of zero-tool-call trials measures agency rather than jj skill. Mitigate with scale if it ships in answer-file form.", "needs_verification": null, "section": "proposed", "slug": "n4", "struck": false, "code": "N4", "headline": "revsets the agent writes"}, {"name": "N5 — filesets", "status": "proposed", "capability": "Writing a fileset — path-scoped selection with `glob:`/`root-file:` patterns — to scope a rewrite. Verifiers in the suite *use* `files(root-file:\"…\")`, but no prompt has ever asked an agent to write one, and `glob:` appears nowhere in the tree.", "prompt_proposed": "Roll back my changes under src/ but leave the generated tree exactly as it is.", "prompt_is_drafted_by_me": false, "fixture": "A commit that changed both `src/**/*.py` and a `src/generated/**` tree, so that the generated subtree is nested inside the directory the user names — the whole difficulty is that the obvious path selector over-selects. The fixture records the bootstrap contents of every generated file so the verifier can require them byte-identical.", "grading": "The verifier asserts that `changed_paths` of the anchored change is exactly the non-generated set, that every generated file's content equals the bootstrap's, and that the anchored change id survives the rewrite. The graded commit is found by anchored change id, and the change-id-survives/commit-id-changed pair distinguishes a genuine in-place rewrite from a rebuilt commit. Doing it file-by-file also passes — the fileset is the cheap route, not the graded one (R3). The fabrication guard is the anchored change id plus the byte-exact generated tree: fabricating a fresh commit with the right final tree fails the anchor, and over-restoring and then re-adding the generated files fails byte-equality only if the fixture's generated content is not trivially reproducible, so the fixture must make it non-reconstructible (machine-looking content with a recorded hash).", "grading_is_inferred": false, "discriminates": "Reaching for a whole-directory restore (`jj restore src/`) or a git-shaped `checkout -- src/`, which silently takes the generated subtree with it — the end state looks right at the top level and the generated tree is quietly clobbered. The correct model is a fileset that subtracts the nested tree.", "risks": "The proposal notes there is no dedicated fileset theme on the survey's 51-theme menu (2.1, split-by-path, is the nearest), so N5 is additive and ships without a survey-verified fixture recipe — meaning R7's stand-it-up-and-solve-it step is the first authoring action, not a later check. It is also a short task and does not help satisfy amendment 2's five-plus-operations requirement.", "needs_verification": null, "section": "proposed", "slug": "n5", "struck": false, "code": "N5", "headline": "filesets"}, {"name": "N6 — immutable revsets", "status": "proposed", "capability": "Immutability: configuring `revset-aliases.\"immutable_heads()\"` and living with jj's refusal to rewrite protected history. Hole C — zero coverage. `immutable_heads()`, `immutable()`, the refusal itself and `--ignore-immutable` are untouched across all 53 tasks; `immutable_heads()` appears exactly once in the tree, in a docstring comment.", "prompt_proposed": "Set this repo up so nothing at or below main can be rewritten by accident, then fix the typo in the message just above it.", "prompt_is_drafted_by_me": false, "fixture": "`main` with two commits below it and two above, and no immutability configured at the start. The fixture must not hand-place `.jj/repo/config.toml` — repo config actually lives at `$HOME/.config/jj/repos/\u003c20-hex>/config.toml`, keyed by `.jj/repo/config-id`, and a hand-placed file there is ignored, so any config the bootstrap sets must go through `jj config set --repo`.", "grading": "The verifier *evaluates* the configured `immutable_heads()` alias in the repo and requires the anchored `main` change to be inside it — never a string match on the config value, because `jj config set --repo` accepts nonsense keys silently at exit 0 and 'the agent set a config key' is never evidence the key does anything. It then asserts the anchored commit below `main` is byte-identical to the bootstrap's (protection actually took effect), and that the anchored change above `main` carries the corrected description under the same change id (the permitted rewrite actually happened). Graded commits resolve through anchored change ids; the change-id-preserved / commit-id-new pair on the fixed commit is the fabrication guard against a rebuilt commit with the right message, and the byte-identical below-main commit closes the 'rewrote everything and then reconstructed it' route. Both halves must be scored so the task cannot be passed by doing only the configuration or only the edit.", "grading_is_inferred": false, "discriminates": "Two wrong models at once. First, that protection is a string you write into a config file — an agent that writes a plausible TOML key that jj does not read exits 0, sees no error, and reports done; the evaluate-the-alias rule is what catches it. Second, that 'set it up so nothing can be rewritten' and 'now rewrite this commit' are in conflict, leading the agent either to skip the config or to reach for `--ignore-immutable` on a commit that was never supposed to be protected.", "risks": "The proposal flags that the 'evaluate the alias, don't string-match the config' design is now mandatory rather than merely preferable (§4.0.2 #7), and warns that 0.44 silently acce
