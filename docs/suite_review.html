pts five config keys it removed — `git.auto-local-bookmark`, `git.push-new-bookmarks`, `ui.revsets-use-glob-by-default`, `core.fsmonitor`, `core.watchman.register-snapshot-trigger` — all exit 0, print nothing, list back happily, and do nothing. A bootstrap that sets one hands over a repo that behaves differently from the one its author designed, and nothing in the build, lint, anchor pass or verifier reports it.", "needs_verification": "The survey ships no immutability theme at all (the proposal's §4.2 table records 'none dedicated'), so N6 has no verified fixture recipe behind it and no execution warrant — it is additive and reasoned-only. Related and worth probing before authoring: a fixture built by `jj git clone` sets `trunk()` to `main@origin` and makes everything up to `main` immutable whether you meant it or not.", "section": "proposed", "slug": "n6", "struck": false, "code": "N6", "headline": "immutable revsets"}, {"name": "N7 — the operation-log surface beyond undo", "status": "proposed", "capability": "The operation log as a diagnosable object: `jj op diff`, `op show`, `op abandon`. Only `op log` and `op restore`/`undo` appear anywhere in the suite; hole H adds that five tasks make the agent write a script but none make it diagnose and report a conclusion.", "prompt_proposed": "Which commits did that big rebase actually touch? Put the change ids in touched.txt.", "prompt_is_drafted_by_me": false, "fixture": "A repo whose op log contains one multi-commit rebase among several small operations, so the target operation must be identified rather than assumed to be the last one. The survey's equivalent (theme 5.3) uses a rebase of a four-commit stack as the most recent operation and asks for `touched.txt`, one change id per line, sorted.", "grading": "The verifier recomputes the operation's effect at verification time by `--at-op` differencing — reading the repo at the operation and at its predecessor and taking the change-id delta — and compares `touched.txt` as a set. Whether the agent used `jj op diff`, `op show` or worked it out by hand is not graded (R3). `--at-op` implies `--ignore-working-copy`, which is required so the verifier does not perturb what it grades. The fabrication guard is that the expected set is never a constant: it is derived from the repository the agent was handed, so a guessed list of plausible-looking ids cannot match, and the anchored change ids let the verifier confirm the history it is differencing is the one the bootstrap produced. No English is matched — recorded operation descriptions are stable across the retarget but stdout formatting is not.", "grading_is_inferred": false, "discriminates": "Guessing the touched set from `jj log` — which shows the current graph, not what the operation changed — instead of reading the operation diff. It also catches the assumption that `Operation` templates expose a working-copy commit; they do not, so op metadata alone cannot answer the question.", "risks": "Two 0.44 caveats the proposal calls load-bearing for N7 and for every other `--at-op` verifier in the suite. First, `jj op show`/`op diff`/`op log -p` now filter changed revisions by default (`revsets.op-diff-changes-in = \"mutable() | immutable_heads()\"`); in a constructed mid-stack rebase both versions printed identical lists, so practical impact is narrow, but it bites when an operation touches hidden or non-head immutable revisions, and `--show-changes-in` overrides. Second and larger: `--no-integrate-operation` plus `jj op integrate` are real on 0.44 (the command was inert on 0.38), so an agent can now produce side effects that leave no op-log entry — any verifier reconstructing truth by `--at-op` differencing is reasoning over a log that is no longer guaranteed complete.", "needs_verification": "The proposal explicitly says the `op integrate` / `--no-integrate-operation` hazard 'is a hazard for N7 specifically and worth a probe before N7 is authored'.", "section": "proposed", "slug": "n7", "struck": false, "code": "N7", "headline": "the operation-log surface beyond undo"}, {"name": "N8 — divergence as a thing to work with", "status": "proposed", "capability": "Divergent change ids: two visible commits sharing one change id, which must be addressed by commit id or through `change_id()` because the bare change-id revset errors. The proposal is explicit that this is a re-scope of `concurrent_operations`, not new capability coverage — that task already builds and resolves a divergence — but nothing hands divergence over pre-made and asks the agent to work with it.", "prompt_proposed": "jj is showing this change twice and complaining — keep the copy that has the file I named in it and get rid of the other one.", "prompt_is_drafted_by_me": true, "fixture": "A repo handed over with the divergence already made — two visible commits sharing one change id, one of them containing a named file. The single-actor route is `jj describe -m A` then `jj --at-op=\u003colder> describe -m B`, which prints `Concurrent modification detected, resolving automatically.` and leaves two `(divergent)` commits. If the two-actor version ships instead (survey theme 4.3), the local-bare-remote rig produces a divergent change and a conflicted bookmark on the same log lines, which is the version with genuinely new content.", "grading": "The verifier counts commits matching `change_id(X)` and requires exactly one visible, asserts `divergent == false` on it, and asserts it is the side carrying the named file. Every revset must spell `change_id(X)` and `bookmarks(name)`: a bare change-id revset errors on a divergent change and a bare bookmark-name revset errors on a conflicted bookmark, so this is a task whose own verifier can be broken by the exact trap it tests — `tasks/concurrent_operations/tests/test_final_state.py:26-31` is the in-tree reference that gets it right. The literal offsets `X/0` and `X/1` must never be matched: `X/N` indexes every commit that has ever carried the change id, hidden ones included, newest first, so any rewrite renumbers what the hint prints. Keep the structural half of `concurrent_operations`'s verifier and delete its English assertion, which currently requires jj's literal phrase 'reconcile divergent operations'. Because the solve removes a change id, the task needs an `anchor_exemptions.json`, and a green pre-sweep pass cannot tell you it is missing — only a correct solve reveals it.", "grading_is_inferred": false, "discriminates": "Treating `??` as the divergence marker — it marks a conflicted *bookmark*, and divergence renders as numbered `X/N` offsets plus `(divergent)`; the two markers can appear on the same log line, and both tutorials get this wrong. The concrete wrong solve is addressing the sides by a bare change id (which errors), or abandoning by change id (ambiguous), instead of by commit id or `X/0`-style offset. In the two-actor version, an agent that reads a conflicted bookmark as divergence abandons a side and loses work.", "risks": "The proposal's own correction: N8 is not new coverage and neither its original framing nor the survey's 'absent: a divergent change' is right about that. If one ships, ship the two-actor version (theme 4.3), which pairs divergence with a conflicted bookmark. The proposal also warns the prompt must name which side survives — in the single-actor route both sides have the same author, so 'keep my version' does not identify one; the surviving side should be named by something the verifier also asserts (a description or a file).", "needs_verification": "The list of operations that legitimately drop a change id — `abandon`, `squash --from/--into`, `new`/`edit`/`prev`/`next` off an empty undescribed `@`, `workspace forget`, `op restore` — was measured on 0.38 and has not been re-measured on 0.44. The proposal calls this the highest-value re-check on its roster, because a wrong entry is a task-arm-destroying missing exemption, and N8 is one of the tasks that needs the exemption.", "section": "proposed", "slug": "n8", "struck": false, "code": "N8", "headline": "divergence as a thing to work with"}, {"name": "N9 — duplicate a range", "status": "proposed", "capability": "`jj duplicate` over a revset range with a placement flag (`-r A::B -d X`, `--insert-after`) — copying a run of commits without moving or rewriting the originals. Absorbs `duplicate_commit`; nothing in the suite duplicates more than a single commit, and the survey's 51-theme menu has no duplicate theme at all, so N9 is one of two additive tasks with no menu backing.", "prompt_proposed": "Copy that run of commits over onto the release branch as well — I want them in both places, so leave the originals exactly where they are.", "prompt_is_drafted_by_me": true, "fixture": "A stack containing a contiguous run of commits (A::B) plus a separate destination — a release bookmark or a second line of history — where the copies must land. Both endpoints of the range and the destination should be anchored, and the run should be long enough that duplicating one commit or the wrong span is a detectably different end state.", "grading": "The verifier asserts each duplicate's own diff individually — one new commit per source commit, each carrying exactly its source's change, in the right order under the named destination — and that both anchored originals are intact: same change ids, same commit ids, same parents. Duplicates cannot be identified by anchored change id (they are new changes minted by the solve), so they must be located structurally, as the set `({destination}..{new head})` or by parent edges from the anchored destination, and then matched to sources by diff rather than by description. The fabrication guard is double: the originals' commit ids must be unchanged (so a solve that *moved* the range and then rebuilt it in place fails), and each duplicate's diff must equal its source's diff (so hand-written approximations fail). Anti-fabrication checks of this shape are not method checks and stay unannounced, per R3.", "grading_is_inferred": true, "discriminates": "The git mental model in which copying commits means cherry-picking them one at a time, which reaches a similar end state by many more operations and is easy to get wrong in the middle — and, more sharply, the model in which 'move these over' is a rebase, which relocates the originals instead of copying them. A solve that rebases and then re-creates the originals fails on the originals' commit ids.", "risks": "The proposal records one measured grader artifact on the task it absorbs — `duplicate_commit`'s refusals were one of the three known artifacts in the current suite — so the replacement must not inherit whatever provoked them. Beyond that the proposal says only that N9 is additive with no survey theme behind it, which under R7 means the fixture must be stood up and solved on the binary before any verifier is written.", "needs_verification": null, "section": "proposed", "slug": "n9", "struck": false, "code": "N9", "headline": "duplicate a range"}, {"name": "N10 — a configured non-interactive diff editor (STRUCK as written)", "status": "proposed", "capability": "Moving a single hunk between commits — partial-content surgery below the file level. Intended to replace `diffedit_interactive` and to reach `ui.diff-editor`, which is untested because all three 'interactive' tasks can be, and by their verifiers' design should be, solved non-interactively.", "prompt_proposed": "Move just the logging hunk out of that commit and leave everything else in it exactly where it is.", "prompt_is_drafted_by_me": true, "fixture": "A commit containing two independent hunks in one file, one of which must move and one of which must stay — the fixture must make the two halves separable by content so the end state is checkable without reference to how the split was performed. If a scripted diff editor ships as part of the fixture, place it outside the repo: a stray `editor.sh` left behind by a solve already breaks floored working-copy guards on `diffedit_interactive` and `split_commit_interactive`.", "grading": "The salvageable version grades the two resulting trees and nothing else: the anchored source change retains exactly the hunk that was meant to stay, the destination carries exactly the hunk that moved, both change ids survive, and no other file in either commit differs from the bootstrap. It must be route-agnostic — every interactive route has a verified non-interactive substitute (`jj squash \u003cpaths>` or `--from`/`--into`, `jj split -r X \u003cpaths> -m`, `jj describe --stdin`, `jj resolve --tool :ours`/`:theirs`), so a verifier cannot tell the routes apart from end state and must not try. Nothing may be graded on `-i` being used, on `ui.diff-editor` being configured, or on the interactive failure text — 0.44 reworded that error, so grade the exit code, or better, nothing at all. Fabrication guard: both commits resolve through anchored change ids and their change-id-preserved/commit-id-new pairs, which closes the rebuild-the-pair-from-scratch route.", "grading_is_inferred": true, "discriminates": "As restated, the file-granular model: an agent that treats 'move that change' as a whole-file operation moves both hunks, or moves the file and re-adds the part that should have stayed, producing a plausible-looking but wrong per-commit diff. The original design's intended discrimination — that the agent must drive an interactive command — is exactly what the proposal rules out of bounds.", "risks": "The proposal strikes N10 and says it must not ship in this form: requiring `-i` is a method constraint and an R3 violation, and the argument for it is gone from both ends. The interactive commands fail fast rather than hang (with stdin closed, `squash -i`/`split -i`/`commit -i`/`diffedit` exit 1 in tens of milliseconds), so an agent that reaches for `-i` loses a turn, not the trial — there is nothing to protect the suite from. Its slot in the target set goes to a Tier 3 composition theme (the survey's 2.1 split-by-path or 3.3 absorb-into-a-stack cover the salvageable ask), per amendment 2. A scripted diff editor via `--tool` is now proven to work headlessly on 0.44, which makes such a fixture possible but does not make grading the route legitimate.", "needs_verification": "The whole task is unresolved rather than merely unverified: the proposal leaves the replacement unspecified beyond 'a Tier 3 theme', so the prompt, fixture and grading above are a reconstruction of the salvageable ask rather than a design the proposal states.", "section": "proposed", "slug": "n10", "struck": true, "code": "N10", "headline": "a configured non-interactive diff editor (STRUCK as written)"}, {"name": "bookmark_create_and_move", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: 'structurally sound and 5/5 on all three models — they belong in a smoke tier or nowhere.' §3 also folds `bookmark_rename` into it as a create → move → rename lifecycle.", "prompt_verbatim": "# Manage Bookmarks in Jujutsu\n\n## Background\nIn Jujutsu (`jj`), bookmarks are named pointers to revisions (similar to Git branches). They are used to mark specific commits, especially when integrating with Git remotes. This task tests your ability to create a bookmark and then move it to a different revision.\n\n## Requirements\n- You have a Jujutsu repository initialized at `/home/user/my-project`.\n- Create a new bookmark named `feature-x` pointing to the initial working copy commit.\n- Create a new commit on top of it with the description `add feature y`.\n- Move the `feature-x` bookmark to point to this new commit.\n\n## Constraints\n- Project path: `/home/user/my-project`\n- Use only `jj` commands.", "prompt_style": "spec", "grading": "Two assertions plus one anchored claim repeated in both. `feature-x` must appear in `jj bookmark list` output, and the commit `feature-x` resolves to must have a description containing 'add feature y'. In each test, the commit `feature-x` points at must also be — or descend from — the working copy the bootstrap handed over, resolved through the anchor's per-workspace key. The commit carrying 'add feature y' is created by the agent so it has no anchored id of its own; it is anchored purely by that ancestry relation. Ancestor-of rather than equal-to is deliberate, so that both the `jj new` + `jj bookmark move` route and the `jj commit` route pass. Two assertions are substring reads of jj output: 'feature-x' in `jj bookmark list`'s human-readable listing, and 'add feature y' in a `-T description` render of agent-authored text. The guard is the shared anchor fixture plus the ancestry claim, which the docstring records as what killed a measured `jj new -r 'root()' -m \"add feature y\"` fabrication that had scored 1.0.", "scoring": "2 tests, 0 floored, 2 scored. The reward is 0, 0.5 or 1.0. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 2, "tests_floored": 0, "tests_scored": 2, "floored_test_names": [], "weaknesses": "The bookmark-list check is a bare substring, so any line mentioning feature-x satisfies it, and nothing asserts the bookmark ever sat on the initial commit first — the 'create then move' half of the task is not separately graded.", "section": "demoted", "slug": "bookmark_create_and_move"}, {"name": "new_commit", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models.", "prompt_verbatim": "# Create a chain of commits in Jujutsu\n\n## Background\nIn Jujutsu (`jj`), the working copy is always a commit. There is no staging area and no separate commit step: file edits land in the current commit as you make them.\n\n## Requirements\nYou have an initialized Jujutsu repository at `/home/user/myproject`.\nYour task is to create a linear chain of 3 commits starting from the current working copy.\n\n1. Modify the **current** working copy commit to have the description `commit 1`, and create a file `file1.txt` containing `first`.\n2. Create a child commit with the description `commit 2`. In this commit, create a file `file2.txt` containing `second`.\n3. Create another child commit with the description `commit 3`. In this commit, create a file `file3.txt` containing `third`.\n\nAt the end of the task, your working copy should be on the commit with description `commit 3`.\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Start command: `cd /home/user/myproject`\n- Port: N/A\n- Do not create any bookmarks, just use the anonymous commits.", "prompt_style": "spec", "grading": "The stack is graded positionally with an anchored floor. `@` must be described exactly 'commit 3' and hold file3.txt containing 'third'; `@-` exactly 'commit 2' with file2.txt containing 'second'; `@--` exactly 'commit 1' with file1.txt containing 'first'. All three tests additionally require `@--` to BE the change the bootstrap handed over as its single working copy, resolved through the anchor's per-workspace key — because requirement 1 says to modify the current working copy rather than create a new commit, so the bottom of the stack is not the agent's to invent. So identification is by position relative to `@`, with only the bottom pinned by anchored change id. Nothing reads jj's English; descriptions are compared exactly and file contents by substring. The guard is the shared anchor fixture — this task deliberately ships no exemption file, since its one bootstrap commit is the graded object — plus the `@--` identity claim, which defeats a three-commit stack fabricated from `root()` and left beside the original.", "scoring": "3 tests, 0 floored, 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all three. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 3, "tests_floored": 0, "tests_scored": 3, "floored_test_names": [], "weaknesses": "Everything above the anchor is positional: a correct three-commit stack that the agent finishes with one extra `jj new` fails all three scored tests.", "section": "demoted", "slug": "new_commit"}, {"name": "new_insert", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models.", "prompt_verbatim": "# Insert a New Commit in a jj Stack\n\n## Background\nYou have a `jj` repository with a stack of commits at `/home/user/myproject`. The commit graph looks like this: `A` -> `B` -> `C`. You need to insert a new commit between `A` and `B` without breaking the descendants.\n\n## Requirements\n- Insert a new commit that is a child of the commit with the description \"commit A\" and a parent of the commit with the description \"commit B\".\n- The new commit must contain a new file named `feature.txt` with the exact text `new feature\\n`.\n- The descendants (`B` and `C`) must be rebased on top of this new commit.\n- The working copy should be left at the tip of the stack (the new version of `C`).\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Do not modify the contents of the existing commits `A`, `B`, or `C`.\n- The final stack should be `A` -> `New Commit` -> `B'` -> `C'`.", "prompt_style": "spec", "grading": "The inserted commit is the agent's, so it has no anchored id; it is addressed as the single commit in `({commit A}..{commit B}) ~ {commit B}` where both endpoints are anchored change ids — i.e. by its position between two commits that cannot be forged. feature.txt must equal 'new feature\\n' both on disk and at that inserted commit, and the inserted commit's own diff (`jj diff --name-only`) must be exactly ['feature.txt']. Separately the ancestry of the anchored 'commit C' must contain A, B and C in the order C below B below A, with exactly one commit between A and B — which is how the auto-rebase of B and C is asserted. Commits are identified by anchored change id and by relation between anchored commits, never by `@`. Nothing reads jj's English; `jj diff --name-only` is a path list. The guard is the shared anchor fixture plus the between-two-anchored-commits addressing, which the docstring records as what killed a reworded parallel A → new → B → C stack built from `root()` that had scored full marks.", "scoring": "3 tests, 0 floored, 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all three. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 3, "tests_floored": 0, "tests_scored": 3, "floored_test_names": [], "weaknesses": "Nothing asserts the inserted commit's description, and nothing asserts that B's and C's own contents survived the rebase — only their order and their change ids.", "section": "demoted", "slug": "new_insert"}, {"name": "obslog_view", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models.", "prompt_verbatim": "# Record the Evolution of the Working-Copy Change\n\n## Background\nIn Jujutsu (`jj`), a change keeps its identity while the commit it points to is replaced every time the change is described, amended, or rebased. The superseded commits are not thrown away: the repository still remembers every commit a change has ever pointed to, even though those versions no longer show up in the ordinary log.\n\n## Requirements\n- The repository is at `/home/user/repo`. Its working-copy change has already gone through several revisions.\n- Write a report of that change's complete evolution to `/home/user/obslog.txt`: every version the change has pointed to, from the commit it points to now all the way back to the version that first created it, each version identified by its commit ID and carrying its description.\n- Leave the repository itself unchanged while you do it: no new commits, no edits to `file.txt`, no description changes. Anything that alters the working-copy change adds a further version to its evolution, which would make a report saved earlier incomplete.\n\n## Constraints\n- Project path: `/home/user/repo`\n- Output file: `/home/user/obslog.txt`\n- Exact formatting is not checked. The report is inspected for the commit ID and description of every version of the change, so any faithful rendering is accepted. Commit IDs may appear abbreviated (at least the first 8 characters) or in full.", "prompt_style": "spec", "grading": "The verifier recomputes the answer instead of storing it. It runs `jj evolog` at the change the bootstrap handed over — resolved by anchored change id from its 'v2' description, not at whatever `@` is — and collects every version's commit id and description first line. The saved report at /home/user/obslog.txt must exist, be non-empty, and (after ANSI escapes are stripped) contain the 8-character prefix of every one of those commit ids, plus every non-empty description they carry. Most of those versions are hidden from an ordinary log, so the ids cannot be produced without actually reading the evolution, and nothing is hardcoded. A fourth, floored test asserts the repository was left alone: file.txt still 'v2\\n', `@` still described 'v2', exactly two commits visible. Identification is by anchored change id; nothing positional. The report is matched by literal substring, but every substring is computed from the repository at verification time rather than written into the verifier. The guard is the shared anchor fixture plus grading the evolution of the anchored change, which the docstring records as what killed a `jj new -r 'root()'; jj describe; jj evolog >` fabrication that had passed every assertion.", "scoring": "4 tests, 1 floored (test_repository_left_unchanged), 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires the floored test to pass too. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 4, "tests_floored": 1, "tests_scored": 3, "floored_test_names": ["test_final_state.py::test_repository_left_unchanged"], "weaknesses": "The report only has to *contain* the ids and descriptions, so any superset — dumping a wider log or the whole op log — passes; and the 'leave the repository alone' requirement is floored, so violating it caps rather than zeroes the score.", "section": "demoted", "slug": "obslog_view"}, {"name": "revert_file", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models. §3 notes it subsumes `restore_file_from_parent`, which is cut.", "prompt_verbatim": "# Revert and Restore Files in Jujutsu\n\n## Background\nYou are working on a Python project managed with Jujutsu (`jj`). You've made several changes in your current working copy, but you realize that some of these changes were a mistake. You need to selectively revert and restore specific files to earlier states while keeping your other work intact.\n\n## Requirements\n1. You must discard the uncommitted changes to `config.py`, reverting it to its exact state in the parent commit.\n2. You must restore the file `utils.py` to its state from a previous commit marked with the bookmark `v1.0`.\n3. You must keep the uncommitted changes to `app.py` exactly as they are in the current working copy.\n4. You must set the description of the current working-copy commit to exactly: `Restore configuration and utilities`\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Do not create any new commits or branches; modify only the current working-copy commit.\n- Do not modify any other files in the repository.", "prompt_style": "spec", "grading": "All three scored tests first require `@` to still BE the working-copy commit the bootstrap handed over, resolved through the anchor's per-workspace key, because the task says to modify only the current working copy and create no new commits. Against that commit: config.py must contain 'DEBUG = False' and utils.py must equal exactly 'def helper(): return \"v1\"', each checked both at the commit via `jj file show` and on disk; and the commit's description must equal exactly 'Restore configuration and utilities'. The fourth, floored test checks that app.py on disk still holds the untouched working-copy change. Identification is by anchored change id (with `@` as the cold-CI fallback), never by offset. Nothing reads jj's English; contents are compared against literals. The guard is the shared anchor fixture plus the `@ == handover change` claim, which the docstring records as what killed a measured `jj new -r 'root()' -m \"Restore configuration and utilities\"` plus write-the-files solve that had scored 1.0.", "scoring": "4 tests, 1 floored (test_app_py_unchanged), 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all four. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 4, "tests_floored": 1, "tests_scored": 3, "floored_test_names": ["test_final_state.py::test_app_py_unchanged"], "weaknesses": "`@` must be exactly the handover change, so an otherwise-correct solve that leaves a fresh empty commit on top scores 0; and config.py is substring-checked rather than compared exactly.", "section": "demoted", "slug": "revert_file"}, {"name": "show_commit", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models.", "prompt_verbatim": "# Inspecting Commits with Jujutsu\n\n## Background\nYou have a Jujutsu (jj) repository at `/home/user/project` with a few commits. You need to create a script to easily show the Git-format diff of specific commits and use it to extract patches for two specific commits.\n\n## Requirements\n1. Create a bash script at `/home/user/project/show_commit.sh`.\n2. The script must take a single argument: a Jujutsu revset.\n3. Given a revset, the script must print that revision's details together with its diff, and the diff must be in Git patch format — the output must contain a `diff --git a/\u003cpath> b/\u003cpath>` header for each changed file.\n4. Make the script executable.\n5. Run your script for the revset `description(substring:\"Add configuration file\")` and redirect the output to `/home/user/project/add_config.patch`.\n6. Run your script for the revset `description(substring:\"Update configuration file\")` and redirect the output to `/home/user/project/update_config.patch`.\n\n## Constraints\n- Project path: `/home/user/project`\n- The script must be executable.\n- The output files must contain the Git-format diff.", "prompt_style": "spec", "grading": "Four assertions over a script and two patch files, tied to commits by identity rather than by content. show_commit.sh must exist and be executable; run with the anchored change id of the bootstrap's 'Add configuration file' commit as its single argument it must exit 0 and print a `diff --git a/config.txt b/config.txt` header, a `+key=value` line, and the 8-character prefix of either that commit's anchored change id or its current commit id. add_config.patch and update_config.patch must exist, carry the expected diff header and +/- lines, and likewise carry the identity of the anchored commit they claim to describe — which is the whole point, because a git diff of identical content is byte-identical, blob hashes included, so text alone cannot tie a patch to a commit. Commits are identified by anchored change id, with the commit id resolved at verification time; nothing positional. Several assertions are literal substring matches, but over git diff text and jj id prefixes rather than jj prose. The guard is the shared anchor fixture plus that id requirement.", "scoring": "4 tests, 0 floored, 4 scored. Partial credit is k/4 with a 0.75 cap on any failure. A no-agent run scores 0 — but the verifier's own docstring states the residual: test_script_exists_and_executable cannot be anchored, so an additive fabrication (or a bare `touch` + `chmod +x`) still collects 1 of 4, i.e. 0.25.", "anchored": true, "anchor_exemptions": false, "tests_total": 4, "tests_floored": 0, "tests_scored": 4, "floored_test_names": [], "weaknesses": "One of the four scored tests asks only whether an executable file exists, so 0.25 is collectable without any repository work at all — stated deliberately in the verifier rather than papered over.", "section": "demoted", "slug": "show_commit"}, {"name": "status_ignored", "status": "built", "keep_tier": "smoke_tier_7", "provisional": false, "separated_models": false, "repair_needed": "§5: smoke tier or nowhere — 5/5 on all three models, though the doc adds that if a second ignore-surface task is wanted this is the one to bring back, its verifier being the strongest of the three.", "prompt_verbatim": "# Ignore and Untrack a File in Jujutsu\n\n## Background\nIn Jujutsu (`jj`), files in the working copy are automatically tracked. If you create a file that should be ignored (like a build artifact or log file) and it gets tracked, simply adding it to `.gitignore` is not enough to remove it from the working-copy commit. You must also explicitly untrack it.\n\n## Requirements\nYou have a Jujutsu repository at `/home/user/project`. It contains a file named `build.log` which is currently tracked by `jj`.\n\nYour task is to:\n1. Add `build.log` to the `.gitignore` file in the repository root so it is ignored.\n2. Untrack `build.log` in Jujutsu so it is no longer tracked by the version control system.\n\n## Constraints\n- Project path: `/home/user/project`\n- **Do not delete** the `build.log` file from the filesystem. It must remain in the `/home/user/project` directory.", "prompt_style": "spec", "grading": "The task is graded as the difference between untracking a file and never having tracked it. After one deliberate `jj status` snapshot: build.log must be absent from `jj file list -r @`; `::@ & files(root-file:\"build.log\")` must hold at least two commits; the most recent of them must not track build.log while its parent still does — i.e. it is the commit that removed it; build.log must still be on disk; and .gitignore must mention build.log both on disk and as recorded in the working-copy commit. Every scored test also requires the *oldest* build.log-touching ancestor to be the anchored 'initial commit' change, so the add-and-remove pair cannot both be the agent's. Identification is by anchored change id for the adding commit and by revset for the removing one; `@` is used only as 'the working copy now', which is what the task is about. Nothing reads jj's English — the old version scanned `jj status` lines and, on a clean working copy, its loop body never ran, so the test asserted nothing. The guard is the shared anchor fixture plus the anchored-adder claim, which the docstring records as what killed an add-then-untrack history fabricated from `root()` that had scored 1.0.", "scoring": "4 tests, 1 floored (test_build_log_exists), 3 scored. Partial credit is 0, 0.333333 or 0.666667; 1.0 requires all four. A no-agent run scores 0.", "anchored": true, "anchor_exemptions": false, "tests_total": 4, "tests_floored": 1, "tests_scored": 3, "floored_test_names": ["test_final_state.py::test_build_log_exists"], "weaknesses": "`.gitignore` is only substring-checked for 'build.log', so an over-broad or negated rule passes, and the ≥2-commits check counts any two commits touching the path rather than the specific pair.", "section": "demoted", "slug": "status_ignored"}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById("suite-data").textContent);
  var items = DATA.items;
  var cur = 0;

  var SECTIONS = {
    shipping: {label:"Shipping now", cls:"sec-ship"},
    proposed: {label:"Proposed \u2014 design stage", cls:"sec-prop"},
    demoted:  {label:"Demoted \u2014 kept, not shipping", cls:"sec-dem"}
  };

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function blk(label, flags){
    var s = el("section","blk");
    var l = el("div","blabel");
    l.appendChild(document.createTextNode(label));
    (flags||[]).forEach(function(f){
      var b = el("span","flag " + (f.cls||"flag-quiet"), f.text);
      l.appendChild(b);
    });
    s.appendChild(l);
    return s;
  }
  function prose(text){ return el("p","prose", text); }

  /* ---------------- index ---------------- */
  var idx = document.getElementById("idx");
  var buttons = [];

  function itemButton(t, i){
    var b = el("button","item sec-" + t.section);
    b.type = "button";
    if(t.struck) b.className += " is-struck";
    b.setAttribute("data-i", String(i));
    var g = el("span","glyph", t.struck ? "\u00d7" : (t.status === "built" ? "\u25c9" : "\u25cb"));
    b.appendChild(g);
    var wrap = el("span");
    var nm = el("span","nm");
    if(t.status === "built"){
      nm.textContent = t.name;
    } else {
      nm.appendChild(el("span","icode", t.code));
      nm.appendChild(document.createTextNode(" " + t.headline));
    }
    wrap.appendChild(nm);
    var dots = el("span","dots");
    if(t.provisional){ var d1 = el("span","dot dot-prov"); d1.title = "provisional"; dots.appendChild(d1); }
    if(t.prompt_terse_verbatim){ var d2 = el("span","dot dot-terse"); d2.title = "has rewritten one-liner"; dots.appendChild(d2); }
    if(dots.childNodes.length) nm.appendChild(dots);
    b.appendChild(wrap);
    b.addEventListener("click", function(){ go(i); });
    buttons.push(b);
    return b;
  }

  function groupHead(cls, name, count){
    var h = el("div","grp " + cls);
    h.appendChild(el("span","gname", name));
    h.appendChild(el("span","gcount", String(count)));
    return h;
  }

  var shipIdx = [], propIdx = [], demIdx = [];
  items.forEach(function(t,i){
    (t.section === "shipping" ? shipIdx : t.section === "proposed" ? propIdx : demIdx).push(i);
  });

  idx.appendChild(groupHead("g-ship","Shipping now", shipIdx.length));
  shipIdx.forEach(function(i){ idx.appendChild(itemButton(items[i], i)); });
  idx.appendChild(groupHead("g-prop","Proposed \u00b7 none built", propIdx.length));
  propIdx.forEach(function(i){ idx.appendChild(itemButton(items[i], i)); });

  var det = document.createElement("details");
  det.className = "demoted-wrap";
  var sum = document.createElement("summary");
  sum.appendChild(el("span","chev","\u25b6"));
  sum.appendChild(el("span",null,"Demoted \u00b7 smoke tier"));
  sum.appendChild(el("span","gcount", String(demIdx.length)));
  det.appendChild(sum);
  var demBox = el("div");
  demIdx.forEach(function(i){ demBox.appendChild(itemButton(items[i], i)); });
  det.appendChild(demBox);
  idx.appendChild(det);

  /* ---------------- stage ---------------- */
  var head = document.getElementById("taskhead");
  var body = document.getElementById("taskbody");
  var prevBtn = el("button", null, "← prev");
  prevBtn.type = "button"; prevBtn.id = "prev"; prevBtn.setAttribute("aria-label","Previous task");
  var nextBtn = el("button", null, "next →");
  nextBtn.type = "button"; nextBtn.id = "next"; nextBtn.setAttribute("aria-label","Next task");

  function renderHead(t, i){
    head.textContent = "";
    var eb = el("div","eyebrow");
    eb.appendChild(el("span", SECTIONS[t.section].cls, SECTIONS[t.section].label));
    if(t.section === "shipping") eb.appendChild(el("span",null,"14 built tasks"));
    if(t.section === "proposed") eb.appendChild(el("span",null,"10 new tasks, none built"));
    if(t.section === "demoted") eb.appendChild(el("span",null,"7 kept, secondary"));
    head.appendChild(eb);

    var row = el("div","titlerow");
    var h2 = el("h2","tname" + (t.struck ? " struck" : ""));
    if(t.status === "proposed"){
      h2.appendChild(el("span","code", t.code + " —"));
      h2.appendChild(document.createTextNode(" " + t.headline));
    } else {
      h2.textContent = t.name;
    }
    row.appendChild(h2);

    var nav = el("div","nav");
    nav.appendChild(prevBtn);
    nav.appendChild(el("span","counter", (i+1) + " / " + items.length));
    nav.appendChild(nextBtn);
    row.appendChild(nav);
    head.appendChild(row);

    var chips = el("div","chips");
    if(t.status === "built"){
      chips.appendChild(el("span","chip chip-built","built"));
      if(t.provisional) chips.appendChild(el("span","chip chip-prov","provisional"));
    } else {
      chips.appendChild(el("span","chip chip-proposed","proposed"));
      if(t.struck) chips.appendChild(el("span","chip chip-struck","struck \u00b7 slot unassigned"));
    }
    if(t.prompt_terse_verbatim) chips.appendChild(el("span","chip chip-quiet","prompt rewritten"));
    if(t.status === "built" && !t.prompt_terse_verbatim) chips.appendChild(el("span","chip chip-quiet","rewrite pending"));
    if(t.status === "built") chips.appendChild(el("span","chip chip-quiet","separated models: " + (t.separated_models ? "yes" : "no")));
    head.appendChild(chips);
  }

  function renderBuilt(t){
    /* prompt */
    var hasTerse = !!t.prompt_terse_verbatim;
    var s = blk(hasTerse ? "The prompt \u00b7 two versions, verbatim"
                         : "The prompt, verbatim \u00b7 instruction.md",
                hasTerse ? [] : [{text:"still spec-style \u2014 rewrite pending", cls:"flag-quiet"}]);
    var pair = el("div","prompt-pair");

    var c1 = el("div","blk");
    if(hasTerse){
      var l1 = el("div","blabel");
      l1.appendChild(document.createTextNode("Current \u2014 instruction.md"));
      l1.appendChild(el("span","flag flag-quiet","spec-style"));
      c1.appendChild(l1);
    }
    var p1 = el("pre","prompt");
    p1.textContent = t.prompt_verbatim;
    c1.appendChild(p1);
    pair.appendChild(c1);

    if(hasTerse){
      var c2 = el("div","blk");
      var l2 = el("div","blabel");
      l2.appendChild(document.createTextNode("Rewritten \u2014 one-line, user voice"));
      l2.appendChild(el("span","flag flag-accent","arm: " + t.terse_arm));
      c2.appendChild(l2);
      var p2 = el("pre","prompt terse");
      p2.textContent = t.prompt_terse_verbatim;
      c2.appendChild(p2);
      pair.appendChild(c2);
    }
    s.appendChild(pair);
    body.appendChild(s);

    /* grading */
    var g = blk("How success is graded");
    g.appendChild(prose(t.grading));
    body.appendChild(g);

    /* scoring */
    var sc = blk("Scoring");
    var m = el("div","meta");
    [["tests total", String(t.tests_total), ""],
     ["floored", String(t.tests_floored), t.tests_floored ? "warn" : "no"],
     ["scored", String(t.tests_scored), "yes"],
     ["anchored", t.anchored ? "yes" : "no", t.anchored ? "yes" : "warn"],
     ["anchor exemptions", t.anchor_exemptions ? "yes" : "none", t.anchor_exemptions ? "" : "no"]
    ].forEach(function(kv){
      var c = el("div","cell");
      c.appendChild(el("div","k", kv[0]));
      c.appendChild(el("div","v " + kv[2], kv[1]));
      m.appendChild(c);
    });
    sc.appendChild(m);
    sc.appendChild(prose(t.scoring));
    if(t.floored_test_names && t.floored_test_names.length){
      var fl = el("div","blabel");
      fl.textContent = "Floored \u2014 must pass, earns nothing";
      sc.appendChild(fl);
      var ul = el("ul","floored");
      t.floored_test_names.forEach(function(n){ ul.appendChild(el("li", null, n)); });
      sc.appendChild(ul);
    }
    body.appendChild(sc);

    /* weaknesses */
    var w = el("div","callout holes");
    w.appendChild(el("div","blabel","Known holes"));
    w.appendChild(prose(t.weaknesses === null || t.weaknesses === undefined ? "None recorded." : t.weaknesses));
    body.appendChild(w);

    /* repair */
    var r = el("div","callout");
    r.appendChild(el("div","blabel","Repair queued"));
    r.appendChild(prose(t.repair_needed === null || t.repair_needed === undefined ? "None \u2014 no repair queued against this task." : t.repair_needed));
    body.appendChild(r);
  }

  function renderProposed(t){
    if(t.struck){
      var st = el("div","callout struck");
      st.appendChild(el("div","blabel","Struck by the proposal"));
      st.appendChild(prose("The proposal strikes N10 as a rule violation \u2014 requiring \u2011i is a method constraint and an R3 violation \u2014 and its slot in the target set is unassigned. The proposal's own answer is to fill that slot from the survey's Tier 3 (2.1 split-by-path or 3.3 absorb-into-a-stack cover the salvageable ask). It is shown here rather than hidden because the ask is salvageable; the wording below is a reconstruction, not a design the proposal states."));
      body.appendChild(st);
    } else {
      var ds = el("div","callout stage-note");
      ds.appendChild(el("div","blabel","Design stage \u2014 nothing built"));
      ds.appendChild(prose(DATA.caveat));
      body.appendChild(ds);
    }

    var flags = [t.prompt_is_drafted_by_me
      ? {text:"wording drafted, not fixed", cls:"flag-amber"}
      : {text:"wording as the proposal states it", cls:"flag-quiet"}];
    var s = blk("The proposed prompt", flags);
    var p = el("pre","prompt proposedp");
    p.textContent = t.prompt_proposed;
    s.appendChild(p);
    body.appendChild(s);

    var g = blk("How success would be graded",
      t.grading_is_inferred ? [{text:"grading reconstructed, not stated by the proposal", cls:"flag-amber"}] : []);
    g.appendChild(prose(t.grading));
    body.appendChild(g);

    var sc = el("div","callout");
    sc.appendChild(el("div","blabel","Scoring, anchoring, known holes"));
    sc.appendChild(prose("Not recorded \u2014 no verifier exists, so there is no test count, no floored set, no anchor decision and no measured weaknesses for this task. Risks below are the proposal's, not measurements."));
    body.appendChild(sc);

    [["Capability", t.capability],
     ["Fixture", t.fixture],
     ["What it discriminates", t.discriminates],
     ["Risks", t.risks]].forEach(function(kv){
      var b = blk(kv[0]);
      b.appendChild(prose(kv[1]));
      body.appendChild(b);
    });

    var v = el("div","callout" + (t.needs_verification ? " verify" : ""));
    v.appendChild(el("div","blabel","Needs verification on 0.44"));
    v.appendChild(prose(t.needs_verification === null || t.needs_verification === undefined
      ? "Nothing flagged for 0.44 verification on this task."
      : t.needs_verification));
    body.appendChild(v);
  }

  function render(){
    var t = items[cur];
    renderHead(t, cur);
    body.textContent = "";
    if(t.status === "built") renderBuilt(t); else renderProposed(t);

    buttons.forEach(function(b){
      b.classList.toggle("on", Number(b.getAttribute("data-i")) === cur);
    });
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === items.length - 1;
    document.getElementById("stage").scrollTop = 0;
    if(t.section === "demoted") det.open = true;
    var on = buttons[cur];
    if(on){
      var rail = document.querySelector(".rail");
      var rb = rail.getBoundingClientRect(), bb = on.getBoundingClientRect();
      if(bb.top < rb.top + 4 || bb.bottom > rb.bottom - 4){
        rail.scrollTop += (bb.top - rb.top) - (rb.height / 2) + (bb.height / 2);
      }
    }
  }

  function go(i, skipHash){
    if(i < 0 || i >= items.length) return;
    cur = i;
    if(!skipHash){
      var h = "#" + items[i].slug;
      if(location.hash !== h) history.replaceState(null, "", h);
    }
    render();
  }

  prevBtn.addEventListener("click", function(){ go(cur - 1); });
  nextBtn.addEventListener("click", function(){ go(cur + 1); });

  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    if(e.key === "ArrowRight" || e.key === "j"){ e.preventDefault(); go(cur + 1); }
    else if(e.key === "ArrowLeft" || e.key === "k"){ e.preventDefault(); go(cur - 1); }
    else if(e.key === "Home"){ e.preventDefault(); go(0); }
    else if(e.key === "End"){ e.preventDefault(); go(items.length - 1); }
  });

  window.addEventListener("hashchange", function(){ fromHash(true); });

  function fromHash(){
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if(!h) return false;
    for(var i = 0; i < items.length; i++){
      if(items[i].slug === h){ go(i, true); return true; }
    }
    return false;
  }

  if(!fromHash()) render();
})();
</script>
