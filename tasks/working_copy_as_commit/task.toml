version = "1.0"

[metadata]

[verifier]
timeout_sec = 60.0
# The verifier needs no network: its dependencies (pytest, pytest-json-ctrf)
# are installed into the image at build time. Denying it egress turns that
# from a property we believe into one the runtime enforces.
network_mode = "no-network"

[agent]
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
POCHI_API_KEY = "${POCHI_API_KEY}"
POCHI_LOG = "debug"

[solution.env]

[environment.env]
POCHI_API_KEY = "${POCHI_API_KEY}"
POCHI_LOG = "debug"
